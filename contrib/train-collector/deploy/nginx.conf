# TLS front end for the training pool collector.
#
# The camera requires an https:// endpoint, so put the collector behind a proxy
# that terminates TLS (or run the collector with TRAIN_TLS_CERT/TRAIN_TLS_KEY
# and skip this file). Only the upload path is exposed; /v1/stats stays on
# loopback.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name train.example.com;

	ssl_certificate     /etc/letsencrypt/live/train.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/train.example.com/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_ciphers         HIGH:!aNULL:!MD5;

	# One frame plus multipart overhead, with a little headroom.
	client_max_body_size 2m;
	client_body_timeout  30s;
	client_header_timeout 15s;

	access_log /var/log/nginx/train-access.log;
	error_log  /var/log/nginx/train-error.log;

	location = /v1/samples {
		limit_except POST {
			deny all;
		}
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		# The collector only reads this when TRAIN_TRUST_PROXY=1.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_request_buffering on;
		proxy_read_timeout 60s;
	}

	location = /healthz {
		proxy_pass http://127.0.0.1:8080;
		access_log off;
	}

	location / {
		return 404;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name train.example.com;

	# No plain-HTTP uploads, ever.
	return 301 https://$host$request_uri;
}
