# Regenerate the squashed U-Boot patches that buildroot applies on top of the
# pinned upstream release.
#
# thingino builds the upstream U-Boot *release* tarball (BR2_TARGET_UBOOT_VERSION)
# and, via the global patch dir (BR2_GLOBAL_PATCH_DIR =
# package/all-patches), applies package/all-patches/uboot/<version>/*.patch to it
# with `patch -p1`. The fork branch (gtxaspec/u-boot ingenic-t-series) is
# maintained by merging upstream u-boot into itself, so a single diff from the
# release tag to the fork branch carries upstream churn plus our T-series port.
#
# This workflow regenerates that as two patches, split at the most recent
# upstream merge into the fork branch, so "release tree + upstream patch +
# thingino patch" reproduces our exact fork tree and the thingino patch stays
# small and reviewable:
#   0001-from-<version>-to-u-boot-head.patch   upstream churn
#   0002-from-u-boot-head-to-thingino.patch    thingino changes
#
# Manual trigger only. Binary files (binman self-test blobs) are excluded: GNU
# patch cannot apply git binary hunks, and the firmware build never touches them.

name: Regenerate U-Boot master patch

on:
  workflow_dispatch:
    inputs:
      fork_repo:
        description: "U-Boot fork repository (HTTPS URL)"
        required: true
        default: "https://github.com/gtxaspec/u-boot.git"
      fork_ref:
        description: "Fork branch or tag to diff against"
        required: true
        default: "ingenic-t-series"
      base_tag:
        description: "Upstream release tag to diff from (matches BR2_TARGET_UBOOT_VERSION)"
        required: true
        default: "v2026.07"

permissions:
  contents: write

concurrency: uboot-master-patch

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout thingino-firmware
        uses: actions/checkout@v5

      - name: Fetch upstream release + fork branch
        run: |
          set -euxo pipefail
          git init uboot
          git -C uboot remote add upstream https://github.com/u-boot/u-boot.git
          git -C uboot remote add fork "${{ inputs.fork_repo }}"
          # The two diffs only need each tip's complete snapshot, but finding
          # the split point needs the fork branch history back to the most
          # recent upstream merge, so fetch a generous window.
          git -C uboot fetch --depth=1 upstream \
            "refs/tags/${{ inputs.base_tag }}:refs/tags/${{ inputs.base_tag }}"
          git -C uboot fetch --depth=4000 fork \
            "${{ inputs.fork_ref }}:refs/heads/fork-ref"

      - name: Generate the patches (text-only, patch -p1 compatible)
        run: |
          set -euxo pipefail
          base="${{ inputs.base_tag }}"
          # Most recent merge in the fork branch's first-parent history: the
          # last upstream merge the thingino work sits on top of.
          split="$(git -C uboot log --first-parent --merges -1 --format=%H fork-ref)"
          [ -n "$split" ] || { echo "error: no merge found in fork branch; cannot split" >&2; exit 1; }
          echo "split point: $split"

          # GNU patch (buildroot's tool) cannot apply git binary hunks; drop any
          # binary files from each diff. --no-renames keeps these paths plain.
          gen_patch() {
            from="$1"
            to="$2"
            out="$3"
            mapfile -t bins < <(git -C uboot diff --no-renames --numstat "$from" "$to" \
                                | awk '$1=="-" || $2=="-" { print $3 }')
            excludes=()
            for f in "${bins[@]}"; do excludes+=(":(exclude)$f"); done
            if [ "${#bins[@]}" -gt 0 ]; then
              printf 'Excluding binary file: %s\n' "${bins[@]}"
            fi
            # --no-renames so renames become delete+add full hunks (GNU patch has no
            # rename support); default a/ b/ prefixes => applied with -p1.
            git -C uboot -c core.quotepath=false diff --no-renames --no-color \
              "$from" "$to" -- . "${excludes[@]}" > "$out"
          }

          gen_patch "$base" "$split" uboot-upstream.patch
          gen_patch "$split" fork-ref uboot-thingino.patch
          ls -l uboot-upstream.patch uboot-thingino.patch
          # Belt-and-suspenders: no git binary hunks may remain.
          ! grep -qE '^Binary files|GIT binary patch' uboot-upstream.patch uboot-thingino.patch

      - name: Verify they apply to a pristine release tree (buildroot's patch cmd)
        run: |
          set -euxo pipefail
          base="${{ inputs.base_tag }}"
          rm -rf verify && mkdir verify
          git -C uboot archive "$base" | tar -x -C verify
          # Exactly buildroot/support/scripts/apply-patches.sh, applied in order.
          # Apply for real (not --dry-run): the second patch needs the first
          # patch's result, so both are exercised against the same tree.
          patch -F0 -g0 -p1 --no-backup-if-mismatch -d verify -t -N \
            < uboot-upstream.patch
          patch -F0 -g0 -p1 --no-backup-if-mismatch -d verify -t -N \
            < uboot-thingino.patch

      - name: Place patches and commit if changed
        run: |
          set -euxo pipefail
          ver="${{ inputs.base_tag }}"; ver="${ver#v}"        # v2026.04 -> 2026.04
          dest_dir="package/all-patches/uboot/${ver}"
          upstream_dest="${dest_dir}/0001-from-${ver}-to-u-boot-head.patch"
          thingino_dest="${dest_dir}/0002-from-u-boot-head-to-thingino.patch"
          mkdir -p "$dest_dir"
          mv uboot-upstream.patch "$upstream_dest"
          mv uboot-thingino.patch "$thingino_dest"
          # Drop the old combined baseline patch if this is the first split run.
          rm -f "${dest_dir}/0001-uboot-master.patch"
          git add "$dest_dir"
          # Use the staged diff: a brand-new (untracked) patch must count as a
          # change. Plain `git diff` ignores untracked files, so it would report
          # "no change" on the very first run and skip the commit.
          if git diff --cached --quiet -- "$dest_dir"; then
            echo "No change to $dest_dir"
            exit 0
          fi
          sha="$(git -C uboot rev-parse fork-ref)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "uboot: regenerate ${ver} patches (${fork_ref} @ ${sha:0:12})"
          git push
