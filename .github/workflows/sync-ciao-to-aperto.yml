# Carry the timps and motors packages from ciao over to aperto (Lu-Fi fork only).
# Only the changes made to PATHS on ciao since the last run are applied to
# aperto (3-way, so aperto's own edits to those packages survive); the rest of
# ciao stays out. The tag ciao-synced marks the ciao commit handled so far. On
# a conflict nothing is pushed and the run fails.
name: sync ciao packages -> aperto

on:
  push:
    branches: [ciao]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ciao-aperto
  cancel-in-progress: false

env:
  PATHS: package/timps package/thingino-motors

jobs:
  sync:
    if: github.repository == 'Lu-Fi/thingino-firmware'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aperto
          fetch-depth: 0
      - name: Apply ciao package changes to aperto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ciao '+refs/tags/ciao-synced:refs/tags/ciao-synced'
          base=$(git rev-parse -q --verify refs/tags/ciao-synced^{commit} || git merge-base origin/ciao HEAD)
          tip=$(git rev-parse origin/ciao)
          if [ "$base" != "$tip" ]; then
            git diff --binary "$base" "$tip" -- $PATHS > /tmp/ciao-pkg.patch
            if [ -s /tmp/ciao-pkg.patch ]; then
              if git apply --3way --index /tmp/ciao-pkg.patch; then
                if ! git diff --cached --quiet; then
                  git commit -q -m "sync: timps/motors packages from ciao ${tip:0:9}"
                  git push origin HEAD:aperto
                fi
              else
                echo "::error::conflict applying ciao package changes to aperto - resolve by hand"
                exit 1
              fi
            fi
          fi
          git tag -f ciao-synced "$tip"
          git push -f origin refs/tags/ciao-synced
