name: SLSA Provenance Generation

# Supply Chain Security - Using GitHub's official attestation action
# Generates SLSA Level 2 provenance for CRA Compliance Article 10
on:
  push:
    branches: [ cra-compliance ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  generate-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # ✅ Required for OIDC signing
      attestations: write  # ✅ Required for GitHub attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: thingino-firmware
          subject-digest: ${{ hashFiles('**') }}
          include-sbom: true
          sbom-format: spdx-json
