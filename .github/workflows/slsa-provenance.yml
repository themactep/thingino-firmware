name: SLSA Provenance Generation

# Supply Chain Security - SLSA Level 2 for CRA Compliance
# Generates cryptographically verifiable provenance for builds
on:
  push:
    branches: [ cra-compliance ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  generate-slsa:
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: ""
      compile-generator: true
      upload-assets: true
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write  # ✅ CRITICAL: Required for OIDC signing
