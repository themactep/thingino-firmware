name: Jarov vlastny Tapo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu
        uses: actions/checkout@v4

      - name: Instalacia buildroot zavislosti
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev rsync unzip bc findutils wget cpio

      - name: Kompilacia Thingino firmveru
        run: |
          make tplink_tapo_c100_t31l_sc2336_rtl8188ftv

      - name: Ulozenie hotoveho bin súboru
        uses: actions/upload-artifact@v4
        with:
          name: tapo-c200-firmware
          path: output/images/
