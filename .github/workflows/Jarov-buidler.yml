name: Jarov vlastny Tapo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu
        uses: actions/checkout@v4

      - name: Kompilacia pomocou oficialneho Docker kontajnera
        run: |
          # Oficiálny Thingino príkaz pre kompiláciu konkrétnej dosky izolovanie v dockeri
          make docker-tplink_tapo_c100_t31l_sc2336_rtl8188ftv

      - name: Ulozenie hotoveho full.bin obrazu
        uses: actions/upload-artifact@v4
        with:
          name: tapo-c200-firmware
          path: output/images/
