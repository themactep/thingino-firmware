name: Jarov vlastny Tapo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kodu
        uses: actions/checkout@v4

      - name: Spustenie oficialneho Thingino build skriptu
        run: |
          # Použijeme originálny vyhladzovací príkaz, ale obmedzíme ho len na tvoju konkrétnu dosku
          ./w7n.sh tplink_tapo_c100_t31l_sc2336_rtl8188ftv

      - name: Ulozenie hotovych binarnych suborov
        uses: actions/upload-artifact@v4
        with:
          name: tapo-c200-firmware
          path: output/images/
