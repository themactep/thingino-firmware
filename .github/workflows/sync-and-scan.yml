name: Sync Upstream + Vulnerability Scan

# CRA Compliance: Sync + SBOM + Vulnerability Scanning
on:
  push:
    branches: [ cra-compliance ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  sync-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      packages: write
    steps:
      # ============================================
      # 1. CHECKOUT CODE
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cra-compliance

      # ============================================
      # 2. SYNC WITH UPSTREAM (themactep/thingino-firmware)
      # ============================================
      - name: Sync with upstream
        run: |
          git config --global user.name "CRA Bot"
          git config --global user.email "cra@cra-consulting.com"
          git remote add upstream https://github.com/themactep/thingino-firmware.git
          git fetch upstream
          git merge upstream/master --no-edit -X theirs || true
          git push origin cra-compliance

      # ============================================
      # 3. GENERATE SBOM (CRA ARTICLE 11 - MANDATORY)
      # ============================================
      - name: Generate SBOM with Syft
        uses: anchore/syft-action@v0.15.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      # ============================================
      # 4. VULNERABILITY SCANNING
      # ============================================

      # 4a. Trivy: Filesystem scan
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
          format: 'sarif'
          output: 'trivy-results.sarif'

      # 4b. Grype: SBOM-based scan
      - name: Grype SBOM vulnerability scan
        uses: anchore/grype-action@v0.60.0
        with:
          sbom: sbom.spdx.json
          format: sarif
          output: grype-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      # 4c. Upload all vulnerability reports to Security tab
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'grype-results.sarif'

      # ============================================
      # 5. CLEANUP
      # ============================================
      - name: Clean up temporary files
        if: always()
        run: |
          rm -f sbom.spdx.json trivy-results.sarif grype-results.sarif

      # ============================================
      # 6. SUMMARY
      # ============================================
      - name: Print completion summary
        run: |
          echo ""
          echo "============================================"
          echo "  CRA COMPLIANCE WORKFLOW COMPLETED"
          echo "============================================"
          echo ""
          echo "✅ Upstream Sync: Completed"
          echo "✅ SBOM Generated: Uploaded as artifact"
          echo "✅ Trivy Scan: Filesystem vulnerabilities"
          echo "✅ Grype Scan: SBOM-based vulnerabilities"
          echo "✅ Security Reports: In GitHub Security tab"
          echo ""
          echo "Note: SLSA provenance is NOT included in this workflow"
          echo "      (requires separate workflow configuration)"
          echo ""
          echo "View results: https://github.com/Em1li0/thingino-firmware/security"
          echo "============================================"
