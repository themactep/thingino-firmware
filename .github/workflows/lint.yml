name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Check do-not-edit paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base SHA available; skipping do-not-edit check"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | scripts/check-do-not-edit.sh
          fi

      - name: Lint shell scripts
        # The action pins shellcheck 0.11.0 (matching local dev).
        # On pull requests, reviewdog posts inline check annotations and filters
        # to findings added by the PR.
        # On pushes, report locally instead: the github-check reporter creates a
        # check run through the checks API, and a failed PATCH there turned this
        # job red even when shellcheck found nothing. The local reporter has no
        # diff to filter against, so a push lints the whole scripts/ tree;
        # fail_level=any still fails the job on a real finding.
        # Pinned to v1 tag commit so the action version can't drift quietly.
        uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-check' || 'local' }}
          filter_mode: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
          fail_level: any
          level: warning
          path: scripts/
          pattern: '*.sh'
          exclude: '*.venv/*'
          # pull in sources referenced from scripts (e.g. scripts/menu/*.sh)
          shellcheck_flags: --external-sources

      - name: Check defconfig sort order
        run: |
          failed=0
          for f in configs/cameras/*/*_defconfig; do
            [ -f "$f" ] || continue
            cp "$f" "$f.lint.bak"
            scripts/sort_defconfig.py "$f" 2>/dev/null
            if ! cmp -s "$f" "$f.lint.bak"; then
              echo "FAIL: $f is not sorted"
              failed=1
            fi
            mv "$f.lint.bak" "$f"
          done
          if [ "$failed" -eq 1 ]; then
            echo "Run 'scripts/sort_defconfig.py <file>' to fix."
            exit 1
          fi

      - name: Validate webui plugins
        run: scripts/check-plugins.sh

      - name: Check tz.json TZ strings
        run: scripts/check-tz-json.sh
