name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check do-not-edit paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base SHA available; skipping do-not-edit check"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | scripts/check-do-not-edit.sh
          fi

      - name: Install shellcheck
        # Pin a specific shellcheck release so CI matches local dev (0.11.0)
        # instead of silently drifting with whatever the distro/runner ships.
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64)  arch=x86_64  ;;
            aarch64) arch=aarch64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          curl -fsSL -o /tmp/shellcheck.tar.xz "$url"
          mkdir -p /tmp/shellcheck
          tar xf /tmp/shellcheck.tar.xz -C /tmp/shellcheck --strip-components=1
          sudo install -m 0755 /tmp/shellcheck/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | head -n 2

      - name: Lint shell scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base SHA available; skipping shellcheck"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD)"
          if [ -z "$files" ]; then
            echo "No files changed; skipping shellcheck"
            exit 0
          fi
          failed=0
          for file in $files; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sh)
                if ! shellcheck -x "$file"; then
                  failed=1
                fi
                ;;
            esac
          done
          if [ "$failed" -eq 1 ]; then
            echo
            echo "shellcheck found warnings in changed shell scripts. Fix them and commit again."
            echo "Use '# shellcheck disable=SCxxxx' with a comment for intentional suppressions."
            exit 1
          fi
          echo "Changed shell scripts pass shellcheck."

      - name: Check defconfig sort order
        run: |
          failed=0
          for f in configs/cameras/*/*_defconfig; do
            [ -f "$f" ] || continue
            cp "$f" "$f.lint.bak"
            scripts/sort_defconfig.py "$f" 2>/dev/null
            if ! cmp -s "$f" "$f.lint.bak"; then
              echo "FAIL: $f is not sorted"
              failed=1
            fi
            mv "$f.lint.bak" "$f"
          done
          if [ "$failed" -eq 1 ]; then
            echo "Run 'scripts/sort_defconfig.py <file>' to fix."
            exit 1
          fi

      - name: Validate webui plugins
        run: scripts/check-plugins.sh
