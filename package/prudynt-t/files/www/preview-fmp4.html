<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · fMP4 preview</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
</head>

<body id="page-preview-fmp4">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>

    <section>
      <div class="card mb-3">
        <div class="card-header">
          <h2 class="card-title">Live View (fMP4)</h2>
          <small>H.264 fragmented MP4 over MSE, reusing the encoder output</small>
          <div class="preview-header-actions">
            <div class="btn-group btn-group-sm" role="group" aria-label="Stream channel">
              <button type="button" class="btn btn-outline-secondary active" id="fmp4-ch0">Main</button>
              <button type="button" class="btn btn-outline-secondary" id="fmp4-ch1">Sub</button>
            </div>
          </div>
        </div><!-- .card-header -->
        <div class="card-body">
          <div id="frame" class="position-relative mb-2">
            <video id="fmp4-video" class="w-100" autoplay muted playsinline controls></video>
          </div>
          <div id="fmp4-status" class="text-muted small"></div>
        </div>
      </div>

      <div class="preview-endpoints text-center" id="preview-endpoints">
        <small>Direct endpoints. Click a link to copy its URL to clipboard.</small>
        <div class="dropdown d-lg-none mt-2" id="preview-endpoint-dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-link-45deg"></i> Endpoints
          </button>
          <ul class="dropdown-menu" id="preview-endpoint-dropdown-menu"></ul>
        </div>
        <div class="preview-endpoint-list mx-4 d-none d-lg-inline-flex" id="preview-endpoint-list"></div>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/preview-fmp4.js"></script>
</body>
</html>
