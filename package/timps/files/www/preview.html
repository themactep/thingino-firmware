<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · timps preview</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
  <style>
    .ms-video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .ms-video-wrap video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    /* Real-time (WebCodecs) player surface. */
    #ms-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
      pointer-events: none;
    }
    /* live motion-grid overlay (drawn by /a/preview-motion.js); it never
       captures the pointer, so the motor joystick keeps working */
    #motion-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    #motor-overlay,
    #motor,
    .jst {
      pointer-events: none;
    }
    .jst {
      visibility: visible !important;
      opacity: 0;
    }
    #motor:hover .jst {
      opacity: 1;
    }
    .jst a {
      pointer-events: auto;
    }
    .ms-hint {
      font-size: 0.875rem;
      color: var(--bs-secondary-color);
    }
    /* Statistics card */
    .st-panel { border: 1px solid var(--bs-border-color-translucent); border-radius: var(--bs-border-radius); background: var(--bs-body-bg); }
    .st-ph { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; padding: .5rem 1rem;
      background: rgba(var(--bs-body-color-rgb), .03); border-bottom: 1px solid var(--bs-border-color-translucent); }
    .st-ph b { color: darkorange; font-weight: 400; font-size: 1rem; }
    .st-chip { font-family: var(--bs-font-monospace); font-size: .72rem; color: var(--bs-secondary-color);
      border: 1px solid var(--bs-border-color); border-radius: .25rem; padding: 0 .3rem; }
    .st-dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #4cc38a; box-shadow: 0 0 0 3px rgb(76 195 138 / .18); }
    .st-dot.warn { background: #f0b429; box-shadow: 0 0 0 3px rgb(240 180 41 / .18); }
    .st-dot.off { background: var(--bs-secondary-color); box-shadow: none; }
    .st-lbl { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--bs-secondary-color); }
    .st-big { font-size: 1.55rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .st-big small { font-size: .78rem; font-weight: 400; color: var(--bs-secondary-color); }
    .st-bar { height: 4px; border-radius: 2px; background: var(--bs-secondary-bg); overflow: hidden; margin-top: .35rem; }
    .st-bar > i { display: block; height: 100%; width: 0; background: #ff8800; transition: width .6s; }
    .st-bar.ok > i { background: #4cc38a; }
    .st-foot { font-size: .75rem; color: var(--bs-secondary-color); display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
    .st-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    canvas.st-chart { display: block; width: 100%; height: 70px; }
    .st-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
    .st-tile { padding: .7rem .9rem; display: grid; grid-template-columns: auto 1fr; gap: .1rem .7rem; align-items: center; }
    .st-tile > i { grid-row: span 2; font-size: 1.4rem; color: darkorange; }
    .st-tile .v { font-weight: 500; }
    .st-tile .s { grid-column: 2; font-size: .75rem; color: var(--bs-secondary-color); }
    .st-gain { position: relative; grid-column: 1 / -1; height: 6px; border-radius: 3px; margin-top: .45rem; }
    .st-gain .m { position: absolute; top: -3px; width: 2px; height: 12px; background: #fff; box-shadow: 0 0 0 1px #000; transition: left .6s; }
    @media (max-width: 768px) { .st-tiles { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 500px) { .st-metrics { grid-template-columns: 1fr 1fr; } }
  </style>
</head>

<body id="page-preview">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>

    <section>
      <div class="card mb-3">
        <div class="card-header d-flex flex-wrap justify-content-between gap-2">
          <div style="flex:1 1 0%; min-width:0;">
            <h2 class="tv-ct">timps Live View</h2>
            <small id="ms-format-desc">Native fMP4 player (no iframe), stream from port 8880</small>
          </div>
          
          <div class="d-flex flex-wrap align-self-end gap-2">
            <select class="form-select form-select-sm" id="ms-stream" title="Select stream" style="width:auto; min-width: 140px;">
              <option value="0">Main stream</option>
              <option value="1">Sub stream</option>
            </select>
            <select class="form-select form-select-sm" id="ms-latency" title="Target buffer margin behind live (lower = less delay, more risk of stalls on a weak link)" style="width:auto;">
              <!-- "rt" switches the player from MSE/<video> to the WebCodecs canvas path (no jitter buffer, video only). -->
              <option value="rt">Real-time (no audio)</option>
              <!-- "whep" switches the player to an RTCPeerConnection fed by timps's POST /webrtc/whep. -->
              <option value="whep">WebRTC (WHEP)</option>
              <option value="0">No buffer (0s)</option>
              <option value="0.5">Low latency (0.5s)</option>
              <option value="1.5" selected>Balanced (1.5s)</option>
              <option value="3">Stable (3s)</option>
            </select>
            
            <button type="button" class="btn btn-outline-secondary" id="ms-motion"
              title="Motion grid overlay" style="display:none">
              <i class="bi bi-grid-3x3"></i>
            </button>
            
            <button type="button" class="btn btn-outline-secondary" id="ms-talk"
              title="Talk to the camera (microphone -&gt; camera speaker)" style="display:none">
              <i class="bi bi-mic"></i>
            </button>
            <button type="button" class="btn btn-outline-secondary" id="ms-stats-toggle" title="Stream stats">
              <i class="bi bi-graph-up"></i>
            </button>
            <button type="button" class="btn btn-outline-secondary" id="ms-connect" title="Connect/Disconnect stream">
              <i class="bi bi-play-circle"></i> Connect
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="ms-video-wrap">
            <video id="ms-video" autoplay muted controls playsinline disableremoteplayback></video>
            <canvas id="ms-canvas" style="display:none" aria-hidden="true"></canvas>
            <canvas id="motion-overlay" style="display:none" aria-hidden="true"></canvas>
            <div class="position-absolute top-50 start-50 translate-middle text-center" id="ms-connecting-overlay" style="display:none;">
              <div class="spinner-border text-light mb-2" role="status" style="width:3rem;height:3rem;">
                <span class="visually-hidden">Connecting...</span>
              </div>
              <div class="text-light small">Connecting...</div>
            </div>
            <!-- PTZ joystick; preview-motors.js shows it on pan/tilt cameras -->
            <div class="position-absolute top-50 start-50 translate-middle" id="motor-overlay" style="display:none">
              <div id="motor">
                <div class="jst">
                  <a class="s" data-dir="uc"></a>
                  <a class="s" data-dir="ur"></a>
                  <a class="s" data-dir="cr"></a>
                  <a class="s" data-dir="dr"></a>
                  <a class="s" data-dir="dc"></a>
                  <a class="s" data-dir="dl"></a>
                  <a class="s" data-dir="cl"></a>
                  <a class="s" data-dir="ul"></a>
                  <a class="b" data-dir="h"></a>
                </div>
              </div>
            </div>
          </div>
          <div class="ms-hint mt-2" id="ms-status"></div>
          <!-- talk-channel state, written only by /a/preview-talk.js. -->
          <div class="ms-hint mt-1" id="ms-talk-status" style="display:none"></div>
        </div>
      </div>
    </section>

    <!-- Statistics: /events stats,daynight,motion SSE, GET /control?stats=1 every 5s,
         full GET /control every 15s for targets/recorder/thresholds. See WEBUI-NOTES.md. -->
    <section>
      <div class="card mb-3" id="stats-card" style="display:none">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <h2 class="tv-ct">Statistics</h2>
            <small>Live encoder &amp; camera status, from timps <code>/control</code></small>
          </div>
        </div>
        <div class="card-body">
          <div class="row g-3 mb-3" id="st-streams"><div class="col text-secondary" data-placeholder>Waiting for stats…</div></div>
          <div class="st-tiles">
            <div class="st-panel st-tile"><i class="bi bi-moon-stars" id="st-dn-i"></i><span class="v" id="st-dn">–</span>
              <span class="s" id="st-dn-s"></span><div class="st-gain" id="st-gain" hidden><span class="m"></span></div></div>
            <div class="st-panel st-tile"><i class="bi bi-person-walking"></i><span class="v" id="st-mo">–</span><span class="s" id="st-mo-s"></span></div>
            <div class="st-panel st-tile"><i class="bi bi-record-circle"></i><span class="v" id="st-rec">–</span><span class="s" id="st-rec-s"></span></div>
            <div class="st-panel st-tile"><i class="bi bi-people"></i><span class="v" id="st-cl">–</span><span class="s">all protocols</span></div>
            <div class="st-panel st-tile"><i class="bi bi-clock-history"></i><span class="v" id="st-up">–</span><span class="s" id="st-ver"></span></div>
            <div class="st-panel st-tile"><i class="bi bi-heart-pulse"></i><span class="v"><span class="st-dot me-1" id="st-hd"></span><span id="st-h">–</span></span><span class="s" id="st-h-s"></span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/timps-api.js"></script>
<script src="/a/timps-version.js"></script>
<script>
  (function () {
    // timps's HTTP server port (http.port in /etc/timps.conf)
    const MS_PORT = 8880;

    const video = document.getElementById("ms-video");
    const rtCanvas = document.getElementById("ms-canvas");
    const connectButton = document.getElementById("ms-connect");
    const streamSelect = document.getElementById("ms-stream");
    const latencySelect = document.getElementById("ms-latency");
    const formatDesc = document.getElementById("ms-format-desc");
    const status = document.getElementById("ms-status");
    const overlay = document.getElementById("ms-connecting-overlay");
    const statsToggle = document.getElementById("ms-stats-toggle");
    const statsCard = document.getElementById("stats-card");
    const statsBox = document.getElementById("st-streams");
    const $st = (id) => document.getElementById("st-" + id);
    if (!video || !connectButton || !streamSelect || !status) return;

    let host = location.hostname || "127.0.0.1";
    if (host.indexOf(":") >= 0 && host[0] !== "[") host = "[" + host + "]"; // raw IPv6
    let base = "http://" + host + ":" + MS_PORT;   /* updated from the token info (scheme/port) */

    // Per-boot timps token, fetched ONCE and shared with preview-motion.js (which subscribes to /events with it).
    function fetchTimpsTokenInfo() {
      return fetch("/x/timps-token.cgi", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);
    }
    // http.https tri-state, as reported by timps-token.cgi's "scheme" field.
    function timpsScheme(info) {
      if (!info) return "http";
      if (info.scheme === "both") {
        return window.location.protocol === "https:" ? "https" : "http";
      }
      if (info.scheme === "https" || info.scheme === "http") return info.scheme;
      return info.tls ? "https" : "http";
    }
    window.timpsTokenInfo = window.timpsTokenInfo || fetchTimpsTokenInfo();
    function refreshTimpsToken() {
      window.timpsTokenInfo = fetchTimpsTokenInfo();
      return window.timpsTokenInfo;
    }

    const params = new URLSearchParams(window.location.search);
    const defaultStream = params.get("stream") || sessionStorage.getItem("ms.stream") || "0";

    const RT_VALUE = "rt";
    const WHEP_VALUE = "whep";
    const DEFAULT_MARGIN_S = 1.5;
    function parseMargin(v) {
      const n = parseFloat(v);
      return (isFinite(n) && n >= 0) ? n : null;
    }
    let targetBehindS = DEFAULT_MARGIN_S;
    let mode = "mse";                                    // "mse" | "rt" | "whep"
    let lastBufferedValue = String(DEFAULT_MARGIN_S);    // margin to return to from rt/whep
    // True only on a genuinely first visit - gates the WHEP-preferred default below.
    const hadNoSavedLatencyPref = localStorage.getItem("ms.latency") === null;
    (function readLatencyPref() {
      const saved = localStorage.getItem("ms.latency");
      if (saved === RT_VALUE) { mode = "rt"; return; }
      if (saved === WHEP_VALUE) { mode = "whep"; return; }
      const n = parseMargin(saved);
      if (n !== null) { targetBehindS = n; lastBufferedValue = String(n); }
    })();

    // Real-time availability, gate 1 of 2: the browser.
    const rtOption = latencySelect
      ? latencySelect.querySelector('option[value="' + RT_VALUE + '"]') : null;
    const HAVE_WEBCODECS = typeof window.VideoDecoder === "function" &&
                           typeof window.EncodedVideoChunk === "function";
    if (!HAVE_WEBCODECS) {
      if (rtOption) rtOption.remove();
      if (mode === "rt") { mode = "mse"; localStorage.setItem("ms.latency", lastBufferedValue); }
    }

    // WebRTC availability, gate 1 of 2: the browser.
    const whepOption = latencySelect
      ? latencySelect.querySelector('option[value="' + WHEP_VALUE + '"]') : null;
    const HAVE_WEBRTC = typeof window.RTCPeerConnection === "function";
    if (!HAVE_WEBRTC) {
      if (whepOption) whepOption.remove();
      if (mode === "whep") { mode = "mse"; localStorage.setItem("ms.latency", lastBufferedValue); }
    }

    function syncLatencySelect() {
      if (!latencySelect) return;
      latencySelect.value = mode === "rt" ? RT_VALUE
                          : mode === "whep" ? WHEP_VALUE
                          : String(targetBehindS);
    }

    // Kept in sync with mode/targetBehindS by applyModeUi(), plus the
    // margin-only change path below (same mode, no reconnect).
    function updateFormatDesc() {
      if (!formatDesc) return;
      formatDesc.textContent =
        mode === "rt"
          ? "Real-time (WebCodecs): lowest latency without WebRTC. No jitter buffer - a weak link freezes or drops frames instead of smoothing over it. Video only, no audio."
        : mode === "whep"
          ? "WebRTC (WHEP): lowest latency, encrypted audio + video over UDP. Needs a direct LAN/VPN path to the camera (no relay/NAT traversal); shares a small pool of concurrent sessions with other viewers."
          : "Buffered fMP4, " + targetBehindS + "s behind live: tolerates network jitter without stalling, carries audio. Higher margin = more stall-proof, lower = less delay.";
    }

    // Show the canvas / hide the <video> (and vice versa).
    function applyModeUi() {
      const rtOn = mode === "rt";
      if (rtCanvas) rtCanvas.style.display = rtOn ? "" : "none";
      video.style.visibility = rtOn ? "hidden" : "";
      if (!rtOn) window.msPreviewSize = null;
      syncLatencySelect();
      updateFormatDesc();
    }

    // Audio contract for the real-time path: it decodes VIDEO ONLY (there is no AudioDecoder/AudioWorklet chain here).
    let userUnmuted = false;
    video.addEventListener("volumechange", () => {
      if (mode !== "rt") userUnmuted = !video.muted;
    });
    function applyModeAudio() {
      if (mode === "rt") { if (!video.muted) video.muted = true; }
      else if (userUnmuted && video.muted) video.muted = false;
    }

    if (latencySelect) {
      syncLatencySelect();
      latencySelect.addEventListener("change", () => {
        const v = latencySelect.value;
        localStorage.setItem("ms.latency", v);
        const newMode = v === RT_VALUE ? "rt" : v === WHEP_VALUE ? "whep" : "mse";
        if (newMode === "mse") {
          const n = parseMargin(v);
          targetBehindS = n === null ? DEFAULT_MARGIN_S : n;
          lastBufferedValue = String(targetBehindS);
        }
        if (newMode === mode) { updateFormatDesc(); return; }   // margin-only change: live, no reconnect
        mode = newMode;
        rtRetries = 0;
        whepRetries = 0;
        applyModeUi();
        applyModeAudio();
        if (running) stopStream("Switching player…").then(() => startStream());
        else setStatus((newMode === "rt" ? "Real-time player"
                        : newMode === "whep" ? "WebRTC player"
                        : "Buffered player") +
                       " selected - click Connect.");
      });
    }

    let statsEs = null;
    let statsStateEs = null;
    let statsControlTimer = null;
    let statsFullTimer = null;
    const MAX_HISTORY = 40; // ~80s of samples at the default 2s stats interval
    const streamRows = {};  // chn -> {el:{...}, history:[kbps,...]}
    const stCfg = {};       // slow GET /control: video targets, record, daynight thresholds, errors
    const stLive = { drops: 0, dn: null };

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(1) + " MB";
    }
    function formatKbps(kbps) {
      return kbps >= 1000 ? (kbps / 1000).toFixed(2) + " Mb/s" : kbps.toFixed(0) + " kb/s";
    }
    function bigKbps(kbps) {
      return kbps >= 1000 ? (kbps / 1000).toFixed(2) + " <small>Mb/s</small>" : kbps.toFixed(0) + " <small>kb/s</small>";
    }
    function formatUptime(s) {
      const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
      return d ? d + " d " + h + " h" : h ? h + " h " + m + " min" : m + " min";
    }
    const PROFILES = ["Baseline", "Main", "High"];

    function drawChart(canvas, values, target) {
      if (!canvas) return;
      const w = canvas.clientWidth || 300, h = canvas.clientHeight || 70, r = window.devicePixelRatio || 1;
      canvas.width = w * r; canvas.height = h * r;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.scale(r, r);
      if (values.length < 2) return;
      const max = Math.max((target || 0) * 1.3, ...values) || 1;
      const px = (i) => (i + MAX_HISTORY - values.length) / (MAX_HISTORY - 1) * w;
      const py = (v) => h - 2 - v / max * (h - 6);
      if (target) {
        const muted = getComputedStyle(canvas).getPropertyValue("--bs-secondary-color").trim() || "#888";
        ctx.strokeStyle = muted; ctx.globalAlpha = .6; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(0, py(target)); ctx.lineTo(w, py(target)); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 1; ctx.fillStyle = muted; ctx.font = "10px sans-serif";
        ctx.fillText("target " + formatKbps(target), 4, py(target) - 3);
      }
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "rgba(255,136,0,.35)"); g.addColorStop(1, "rgba(255,136,0,0)");
      ctx.beginPath(); ctx.moveTo(px(0), h);
      values.forEach((v, i) => ctx.lineTo(px(i), py(v)));
      ctx.lineTo(px(values.length - 1), h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      ctx.beginPath();
      values.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
      ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 1.5; ctx.stroke();
    }

    function ensureStatsRow(chn) {
      if (streamRows[chn]) return streamRows[chn];
      if (!statsBox) return null;
      const ph = statsBox.querySelector("[data-placeholder]");
      if (ph) ph.remove();
      const col = document.createElement("div");
      col.className = "col-lg-6";
      col.innerHTML =
        '<div class="st-panel"><div class="st-ph"><span class="st-dot" data-k="dot"></span>' +
        '<b>' + (chn === 0 ? "Main stream" : chn === 1 ? "Substream" : "Stream " + chn) + '</b>' +
        '<span class="st-chip" data-k="res"></span><span class="st-chip" data-k="codec"></span>' +
        '<span class="st-chip" data-k="rc" hidden></span></div><div class="p-3">' +
        '<div class="st-metrics mb-2">' +
        '<div><div class="st-lbl">Frame rate</div><div class="st-big" data-k="fps"></div><div class="st-bar ok"><i data-k="fpsb"></i></div></div>' +
        '<div><div class="st-lbl">Bitrate</div><div class="st-big" data-k="kbps"></div><div class="st-bar"><i data-k="kbpsb"></i></div></div>' +
        '<div><div class="st-lbl">Viewers</div><div class="st-big" data-k="subs"></div><div class="st-foot mt-1">on this stream</div></div>' +
        '</div><canvas class="st-chart" data-k="chart" aria-label="bitrate trend"></canvas>' +
        '<div class="st-foot mt-2"><span data-k="avg"></span><span data-k="queue"></span><span data-k="drops"></span></div>' +
        '</div></div>';
      const el = {};
      col.querySelectorAll("[data-k]").forEach((n) => { el[n.getAttribute("data-k")] = n; });
      statsBox.appendChild(col);
      const row = { el, history: [], chn };
      streamRows[chn] = row;
      return row;
    }

    function renderHealth() {
      const issues = [];
      if (stLive.drops) issues.push(stLive.drops + " dropped frames");
      const qd = (stCfg.queue_drops || []).reduce((a, b) => a + b, 0);
      if (qd) issues.push(qd + " queue drops");
      const errs = Object.keys(stCfg.last_errors || {});
      if (errs.length) issues.push("errors: " + errs.join(", "));
      $st("hd").classList.toggle("warn", issues.length > 0);
      $st("h").textContent = issues.length ? "Check" : "Healthy";
      $st("h-s").textContent = issues.length ? issues.join(" · ") : "no drops · no errors";
    }

    // fast path: every "stats" SSE frame (~2s)
    function renderStats(j) {
      $st("up").textContent = formatUptime(j.uptime_s);
      $st("cl").textContent = j.clients + (j.clients === 1 ? " client" : " clients");
      stLive.drops = 0;
      (j.video || []).forEach((s) => {
        const row = ensureStatsRow(s.chn);
        if (!row) return;
        const cfg = (stCfg.video || {})[s.chn] || {};
        const e = row.el;
        e.res.textContent = s.width + "×" + s.height;
        if (!e.codec.dataset.p) e.codec.textContent = s.codec.toUpperCase();
        e.fps.innerHTML = s.fps.toFixed(1) + (cfg.fps ? " <small>/ " + cfg.fps + "</small>" : "");
        e.fpsb.style.width = (cfg.fps ? Math.min(100, s.fps / cfg.fps * 100) : 0) + "%";
        e.kbps.innerHTML = bigKbps(s.kbps);
        e.kbpsb.style.width = (cfg.bitrate ? Math.min(100, s.kbps / (cfg.bitrate * 1.5) * 100) : 0) + "%";
        e.subs.textContent = String(s.subs);
        e.drops.textContent = s.drop_frames
          ? s.drop_frames + " dropped frames (" + formatBytes(s.drop_bytes) + ")" : "0 dropped frames";
        stLive.drops += s.drop_frames || 0;
        e.dot.classList.toggle("warn", !!s.drop_frames || (cfg.fps && s.fps < cfg.fps * 0.8));
        row.history.push(s.kbps);
        if (row.history.length > MAX_HISTORY) row.history.shift();
        const avg = row.history.reduce((a, b) => a + b, 0) / row.history.length;
        e.avg.textContent = "avg " + formatKbps(avg) + (cfg.bitrate ? " (target " + formatKbps(cfg.bitrate) + ")" : "");
        drawChart(e.chart, row.history, cfg.bitrate);
      });
      renderHealth();
    }

    // ?stats=1 every 5s: rc mode/profile/gop + encoder backlog
    function applyStatsExtra(j) {
      if (!j) return;
      const video = j.video || {}, enc = j.encoder || {};
      Object.keys(video).forEach((k) => {
        const row = streamRows[parseInt(k, 10)];
        if (!row) return;
        const v = video[k], e = row.el;
        const codec = e.codec.textContent.split(" ")[0];
        e.codec.textContent = codec + (PROFILES[v.profile] ? " " + PROFILES[v.profile] : "");
        e.codec.dataset.p = "1";
        e.rc.textContent = String(v.rc_mode || "").toUpperCase() + " · GOP " + v.gop;
        e.rc.hidden = false;
        const es = enc[k];
        if (es && es.ave_bitrate > 0) e.queue.textContent = "encoder avg " + formatKbps(es.ave_bitrate);
        else if (es) {
          e.queue.textContent = "encoder queue " + es.left_pics;
          e.queue.title = formatBytes(es.left_stream_bytes) + " / " + es.left_stream_frames + " stream frame(s) unclaimed";
        } else e.queue.textContent = "";
      });
    }

    function renderDaynight(dn) {
      if (dn) stLive.dn = Object.assign(stLive.dn || {}, dn);
      dn = stLive.dn;
      if (!dn) return;
      const night = dn.mode === 1;
      const mode = dn.dn_mode || (dn.enabled ? "auto" : "manual");
      $st("dn").textContent = (night ? "Night" : dn.mode === 0 ? "Day" : "Unknown") + " · " + mode;
      $st("dn-i").className = night ? "bi bi-moon-stars" : "bi bi-sun";
      const g = dn.total_gain, lo = dn.total_gain_day_threshold, hi = dn.total_gain_night_threshold;
      const bar = $st("gain");
      if (typeof g === "number" && g >= 0 && lo > 0 && hi > lo && mode === "auto") {
        $st("dn-s").textContent = "gain " + g.toFixed(0) + (night ? " · day below " + lo : " · night above " + hi);
        const span = hi * 2;
        bar.style.background = "linear-gradient(90deg,#f0c040 0 " + (lo / span * 100) + "%,#555 " +
          (lo / span * 100) + "% " + (hi / span * 100) + "%,#3a5fcd " + (hi / span * 100) + "%)";
        bar.firstChild.style.left = Math.min(100, g / span * 100) + "%";
        bar.hidden = false;
      } else {
        $st("dn-s").textContent = typeof g === "number" && g >= 0 ? "gain " + g.toFixed(0) : "";
        bar.hidden = true;
      }
    }
    function renderMotion(mo) {
      if (!mo) return;
      const active = mo.active && mo.active.length;
      $st("mo").textContent = !mo.available ? "Motion n/a" : !mo.enabled ? "Motion off" : active ? "Motion!" : "Motion on";
      $st("mo-s").textContent = !mo.available ? "not in this build" : !mo.enabled ? "detection disabled" :
        active ? active.length + " cell(s) active" : "watching, nothing moving";
    }
    function renderRecord(r) {
      if (!r) return;
      $st("rec").textContent = !r.available ? "Recorder n/a" : r.recording ? "Recording" : r.enabled ? "Recorder armed" : "Recorder off";
      $st("rec-s").textContent = r.available ? (r.free_mb >= 0 ? r.free_mb + " MB free" : "no storage") : "not in this build";
    }

    // slow path: full GET /control every 15s (targets, recorder, thresholds, errors)
    function fetchStatsFull() {
      timpsApiReady().then((api) => api.get()).then((j) => {
        stCfg.video = j.video || {};
        stCfg.queue_drops = j.queue_drops;
        stCfg.last_errors = j.last_errors;
        $st("ver").textContent = j.version ? "timps " + j.version : "";
        renderDaynight(j.daynight);
        renderMotion(j.motion);
        renderRecord(j.record);
        renderHealth();
      }).catch(() => {});
    }

    function fetchStatsExtra() {
      timpsApiReady().then((api) => api.statsExtra()).then(applyStatsExtra)
        .catch(() => { /* offline poll tick - panels just keep their last values */ });
    }

    async function startStats() {
      if (statsEs || !window.EventSource) return;
      const info = await window.timpsTokenInfo;
      if (statsCard.style.display === "none") return; // toggled off while awaiting the token
      const b = info ? timpsScheme(info) + "://" + host + ":" + (info.port || MS_PORT) : base;
      const tok = info && info.token ? "&token=" + encodeURIComponent(info.token) : "";
      statsEs = new EventSource(b + "/events?stream=stats" + tok);
      statsEs.addEventListener("stats", (ev) => {
        try { renderStats(JSON.parse(ev.data)); } catch (e) { /* ignore malformed frame */ }
      });
      statsEs.onerror = () => { /* EventSource auto-reconnects (server retry: 3000) */ };
      if (!statsStateEs && window.timpsApi) {
        statsStateEs = window.timpsApi.events("daynight,motion", (type, data) => {
          if (type === "daynight") renderDaynight(data);
          else if (type === "motion") renderMotion(data);
        });
      }
      fetchStatsFull();
      fetchStatsExtra();
      if (!statsFullTimer) statsFullTimer = setInterval(fetchStatsFull, 15000);
      if (!statsControlTimer) statsControlTimer = setInterval(fetchStatsExtra, 5000);
    }
    function stopStats() {
      if (statsEs) { statsEs.close(); statsEs = null; }
      if (statsStateEs) { statsStateEs.close(); statsStateEs = null; }
      if (statsControlTimer) { clearInterval(statsControlTimer); statsControlTimer = null; }
      if (statsFullTimer) { clearInterval(statsFullTimer); statsFullTimer = null; }
      Object.keys(streamRows).forEach((k) => delete streamRows[k]);
      stLive.dn = null;
      if (statsBox) statsBox.innerHTML = '<div class="col text-secondary" data-placeholder>Waiting for stats…</div>';
      ["dn", "mo", "rec", "cl", "up", "h"].forEach((k) => { $st(k).textContent = "–"; });
      ["dn-s", "mo-s", "rec-s", "ver", "h-s"].forEach((k) => { $st(k).textContent = ""; });
      $st("gain").hidden = true;
    }
    if (statsToggle && statsCard) {
      const statsWanted = sessionStorage.getItem("ms.stats") === "1";
      const applyStatsUi = (on) => {
        statsCard.style.display = on ? "" : "none";
        statsToggle.classList.toggle("active", on);
        if (on) startStats(); else stopStats();
      };
      statsToggle.addEventListener("click", () => {
        const on = statsCard.style.display === "none";
        sessionStorage.setItem("ms.stats", on ? "1" : "0");
        applyStatsUi(on);
      });
      applyStatsUi(statsWanted);
    }

    let mediaSource = null;
    let abortCtrl = null;
    let running = false;
    // Monotonic stream-session token: every start/stop bumps it.
    let session = 0;

    let wantStream = true;        // user intent; false only after a real Disconnect
    let reconnectPending = false;
    let bootPending = true;
    let lastProgressAt = 0;       // performance.now() of the last byte off the wire
    function noteProgress() { lastProgressAt = performance.now(); }

    function setStatus(message) { status.textContent = message; }

    function setConnectingUi(active) {
      if (overlay) overlay.style.display = active ? "" : "none";
      if (active) {
        connectButton.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Connecting…';
        connectButton.disabled = true;
      } else {
        connectButton.disabled = false;
      }
    }

    function setConnectedUi(connected) {
      connectButton.innerHTML = connected
        ? '<i class="bi bi-stop-circle"></i> Disconnect'
        : '<i class="bi bi-play-circle"></i> Connect';
      // the stream select stays enabled while connected: picking another
      // stream live tears the player down and rebuilds it on the new channel
      if (connected) setConnectingUi(false);
    }

    function pickMime(MS, wantAac) {
      const vOnly = [
        'video/mp4; codecs="avc1.640028"',            // H.264 High
        'video/mp4; codecs="hvc1.1.6.L123.B0"'        // H.265
      ];
      const withAac = [
        'video/mp4; codecs="avc1.640028, mp4a.40.2"',
        'video/mp4; codecs="hvc1.1.6.L123.B0, mp4a.40.2"'
      ];
      const candidates = wantAac ? withAac.concat(vOnly) : vOnly;
      for (const m of candidates) {
        if (MS && MS.isTypeSupported(m)) return m;
      }
      return null;
    }

    // Resolve the timps endpoint from the per-boot token info (scheme/port),
    // and the "&token=..." suffix both the stream fetch and /control use.
    async function endpoint() {
      const info = await window.timpsTokenInfo;
      if (info) base = timpsScheme(info) + "://" + host + ":" + (info.port || MS_PORT);
      return { base: base, tok: info && info.token ? "&token=" + encodeURIComponent(info.token) : "" };
    }

    const CONTROL_TIMEOUT_MS = 8000;
    let controlCache = null, controlCacheAt = 0, controlInflight = null;
    async function controlSnapshot(apiBase, tok, maxAgeMs) {
      const now = Date.now();
      if (controlCache && now - controlCacheAt < (maxAgeMs === undefined ? 10000 : maxAgeMs))
        return controlCache;
      if (controlInflight) return controlInflight;   // coalesce parallel callers
      controlInflight = (async () => {
        const ac = new AbortController();
        const t = setTimeout(() => { try { ac.abort(); } catch (e) { /* ignore */ } },
                             CONTROL_TIMEOUT_MS);
        try {
          const r = await fetch(apiBase + "/control" + (tok ? "?" + tok.slice(1) : ""),
                                { cache: "no-store", signal: ac.signal });
          if (!r.ok) return null;
          const j = await r.json();
          controlCache = j; controlCacheAt = Date.now();
          return j;
        } catch (e) {                 // unreachable/timed out -> safe default
          console.warn("[preview] /control probe failed:", e && e.message ? e.message : e);
          return null;
        }
        finally { clearTimeout(t); controlInflight = null; }
      })();
      return controlInflight;
    }

    async function streamHasAac(apiBase, tok) {
      const j = await controlSnapshot(apiBase, tok);
      return !!(j && j.audio && j.audio.enabled && j.audio.codec === "aac");
    }

    // Real-time availability, gate 2 of 2: the SELECTED stream must be H.264.
    async function refreshRtOption() {
      if (!HAVE_WEBCODECS || !rtOption || !latencySelect) return;
      const chn = streamSelect.value === "1" ? "1" : "0";
      const { base: b, tok } = await endpoint();
      const j = await controlSnapshot(b, tok);
      const vcfg = j && j.video ? j.video[chn] : null;
      // unreachable /control: leave the option as-is rather than yanking it
      // out from under the user; the moov parser rejects non-H.264 anyway.
      if (!vcfg) return;
      const ok = String(vcfg.codec || "").toLowerCase() === "h264";
      rtOption.disabled = !ok;
      rtOption.title = ok ? "" :
        "Real-time decoding needs H.264; this stream is " + String(vcfg.codec).toUpperCase();
      if (!ok && mode === "rt") {
        mode = "mse";
        targetBehindS = parseMargin(lastBufferedValue) === null ? DEFAULT_MARGIN_S : parseMargin(lastBufferedValue);
        localStorage.setItem("ms.latency", lastBufferedValue);
        applyModeUi();
        applyModeAudio();
        setStatus("Real-time mode is H.264-only - this stream is " +
                  String(vcfg.codec).toUpperCase() + "; using buffered playback.");
        // setStatus() alone gets overwritten within seconds - toast survives.
        if (typeof window.showAlert === "function")
          window.showAlert("warning", "Real-time mode needs H.264; this stream is " +
                            String(vcfg.codec).toUpperCase() +
                            ". Falling back to buffered playback.", 12000);
        if (running) stopStream("Switching player…").then(() => startStream());
      }
    }

    async function stopStream(reason = "Disconnected") {
      session++;              // invalidate all async work of the old session
      running = false;
      reconnectPending = false;   // the session bump just cancelled any armed retry
      if (abortCtrl) {
        try { abortCtrl.abort(); } catch (e) { /* ignore */ }
        abortCtrl = null;
      }
      if (mediaSource) {
        try { if (mediaSource.readyState === "open") mediaSource.endOfStream(); } catch (e) { /* ignore */ }
        mediaSource = null;
      }
      rtTeardown();
      whepTeardown(reason);
      video.removeAttribute("src");
      try { video.load(); } catch (e) { /* ignore */ }
      setConnectingUi(false);
      setConnectedUi(false);
      setStatus(reason);
    }

    const RT_MAX_RETRIES = 5;
    let rt = null;             // active real-time player state, or null
    let rtRetries = 0;         // consecutive reconnect attempts (reset on 1st frame)
    let rtTokenRefreshed = false;  // one token renewal per healthy run, no 401 loop

    // Buffered-player counterpart of RT_MAX_RETRIES/rtRetries, kept next to them so the two budgets stay visibly in sync.
    const MSE_MAX_RETRIES = 5;
    let mseRetries = 0;        // consecutive reconnect attempts (reset on 1st append)
    let mseTokenRefreshed = false; // one token renewal per healthy run, no 401 loop

    /* One ISO-BMFF box at `off`, or null when the buffer does not hold it all */
    function boxAt(bytes, off) {
      if (off + 8 > bytes.length) return null;
      const dv = new DataView(bytes.buffer, bytes.byteOffset + off, bytes.length - off);
      let size = dv.getUint32(0), hdr = 8;
      const type = String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);
      if (size === 1) {                       // 64-bit extended size
        if (off + 16 > bytes.length) return null;
        size = dv.getUint32(8) * 4294967296 + dv.getUint32(12);
        hdr = 16;
      }
      if (size < hdr || off + size > bytes.length) return null;
      return { type: type, size: size, payload: bytes.subarray(off + hdr, off + size) };
    }

    /* Walk a container path, e.g. findBox(trak, ["mdia","minf","stbl","stsd"]) */
    function findBox(bytes, path) {
      let cur = bytes;
      for (let i = 0; i < path.length; i++) {
        let found = null, off = 0, b;
        while ((b = boxAt(cur, off))) {
          if (b.type === path[i]) { found = b.payload; break; }
          off += b.size;
        }
        if (!found) return null;
        cur = found;
      }
      return cur;
    }

    // Video track id + media timescale + avcC out of the init segment.
    function rtParseMoov(moov) {
      const out = { trackId: null, timescale: 90000, avcC: null, videoFourCC: null };
      let off = 0, b;
      while ((b = boxAt(moov, off))) {
        if (b.type === "trak") {
          const trak = b.payload;
          const tkhd = findBox(trak, ["tkhd"]);
          let trackId = null;
          if (tkhd && tkhd.length >= 24) {
            const dv = new DataView(tkhd.buffer, tkhd.byteOffset, tkhd.length);
            trackId = tkhd[0] === 1 ? dv.getUint32(20) : dv.getUint32(12);
          }
          const stsd = findBox(trak, ["mdia", "minf", "stbl", "stsd"]);
          // stsd payload: version(1)+flags(3)+entry_count(4), then entries
          const entry = stsd ? boxAt(stsd, 8) : null;
          if (entry && (entry.type === "avc1" || entry.type === "avc3" ||
                        entry.type === "hvc1" || entry.type === "hev1")) {
            out.videoFourCC = entry.type;
            out.trackId = trackId;
            if (entry.type === "avc1" || entry.type === "avc3")
              out.avcC = findBox(entry.payload.subarray(78), ["avcC"]);
            const mdhd = findBox(trak, ["mdia", "mdhd"]);
            if (mdhd && mdhd.length >= 24) {
              const dv = new DataView(mdhd.buffer, mdhd.byteOffset, mdhd.length);
              const ts = mdhd[0] === 1 ? dv.getUint32(20) : dv.getUint32(12);
              if (ts > 0) out.timescale = ts;
            }
          }
        }
        off += b.size;
      }
      return out;
    }

    /* traf -> tfhd.track_ID (always right after the 4 fullbox bytes) */
    function rtTrafTrackId(traf) {
      const tfhd = findBox(traf, ["tfhd"]);
      if (!tfhd || tfhd.length < 8) return null;
      return new DataView(tfhd.buffer, tfhd.byteOffset, tfhd.length).getUint32(4);
    }

    /* traf -> tfdt baseMediaDecodeTime (fmp4.c writes version 1, 64-bit) */
    function rtTrafDts(traf) {
      const tfdt = findBox(traf, ["tfdt"]);
      if (!tfdt || tfdt.length < 8) return null;
      const dv = new DataView(tfdt.buffer, tfdt.byteOffset, tfdt.length);
      return tfdt[0] === 1
        ? (tfdt.length >= 12 ? dv.getUint32(4) * 4294967296 + dv.getUint32(8) : null)
        : dv.getUint32(4);
    }

    function rtIsKeyframe(au, lenSize) {
      let off = 0;
      while (off + lenSize < au.length) {
        let n = 0;
        for (let i = 0; i < lenSize; i++) n = n * 256 + au[off + i];
        if (n <= 0 || off + lenSize + n > au.length) break;
        const nalType = au[off + lenSize] & 0x1f;
        if (nalType === 5) return true;               // IDR slice
        off += lenSize + n;
      }
      return false;
    }

    function rtTeardown() {
      if (!rt) return;
      const st = rt;
      rt = null;
      st.dead = true;
      if (st.statsTimer) { clearInterval(st.statsTimer); st.statsTimer = null; }
      if (st.decoder) {
        try { if (st.decoder.state !== "closed") st.decoder.close(); } catch (e) { /* ignore */ }
        st.decoder = null;
      }
      if (rtCanvas) {
        const ctx = rtCanvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, rtCanvas.width, rtCanvas.height);
      }
    }

    function rtFallbackToMse(why) {
      mode = "mse";
      targetBehindS = parseMargin(lastBufferedValue) === null ? DEFAULT_MARGIN_S : parseMargin(lastBufferedValue);
      localStorage.setItem("ms.latency", lastBufferedValue);
      if (rtOption) { rtOption.disabled = true; rtOption.title = why; }
      applyModeUi();
      applyModeAudio();
      // See whepFallbackToMse() for why this needs a toast, not just setStatus().
      if (typeof window.showAlert === "function")
        window.showAlert("warning", "Real-time mode: " + why + " Falling back to buffered playback.", 12000);
      stopStream(why + " - switched to buffered playback.").then(() => startStream());
    }

    async function startRtStream(mySession) {
      const chn = streamSelect.value === "1" ? "1" : "0";
      const { base: b, tok } = await endpoint();
      if (session !== mySession) return;
      const src = b + "/stream.mp4?chn=" + chn + tok;
      const hasAac = await streamHasAac(b, tok);
      if (session !== mySession) return;

      const ctx = rtCanvas ? rtCanvas.getContext("2d") : null;
      if (!ctx) { rtFallbackToMse("No 2D canvas available"); return; }

      const st = {
        dead: false, decoder: null, trackId: null, timescale: 90000,
        lenSize: 4, pendingVideo: false, pendingDts: null, sawKey: false,
        frames: 0, lastFrames: 0, queueMax: 0, lastArrival: 0, lat: 0,
        buf: new Uint8Array(0), statsTimer: null, w: 0, h: 0
      };
      rt = st;

      const audioNote = hasAac ? " · audio unavailable in this mode" : "";
      const label = chn === "1" ? "sub" : "main";

      function fatal(msg) {
        if (st.dead || session !== mySession) return;
        scheduleReconnect(msg);
      }

      function scheduleReconnect(msg) {
        if (session !== mySession) return;
        rtTeardown();
        try { if (abortCtrl) abortCtrl.abort(); } catch (e) { /* ignore */ }
        abortCtrl = null;
        running = false;
        if (rtRetries >= RT_MAX_RETRIES) {
          reconnectPending = false;
          setConnectedUi(false);
          setConnectingUi(false);
          setStatus(msg + " - gave up after " + RT_MAX_RETRIES +
                    " attempts. Click Connect to retry.");
          console.warn("[preview] rt: gave up after " + RT_MAX_RETRIES +
                       " attempts (" + msg + ") - watchdog may still retry later");
          return;
        }
        const delay = Math.min(8000, 500 * Math.pow(2, rtRetries));
        rtRetries++;
        reconnectPending = true;
        setStatus(msg + " - reconnecting in " + (delay / 1000).toFixed(1) +
                  "s (attempt " + rtRetries + "/" + RT_MAX_RETRIES + ")…");
        console.warn("[preview] rt: " + msg + " - retry " + rtRetries + "/" +
                     RT_MAX_RETRIES + " in " + delay + "ms");
        setTimeout(() => {
          // a stop / stream switch / mode switch in the meantime bumps the
          // session token, and that silently cancels this retry
          if (session !== mySession || mode !== "rt") return;
          reconnectPending = false;
          startStream();
        }, delay);
      }

      function onFrame(frame) {
        if (st.dead) { try { frame.close(); } catch (e) { /* ignore */ } return; }
        const w = frame.displayWidth || frame.codedWidth;
        const h = frame.displayHeight || frame.codedHeight;
        if (w && h && (st.w !== w || st.h !== h)) {
          st.w = w; st.h = h;
          rtCanvas.width = w; rtCanvas.height = h;
          // tells preview-motion.js the intrinsic size; the hidden <video>
          // has no metadata of its own while this player owns the frame
          window.msPreviewSize = { w: w, h: h };
        }
        // A backgrounded tab still gets frames; decode them (so the stream
        // keeps flowing and we stay at the live edge) but skip the paint.
        if (!document.hidden) {
          try { ctx.drawImage(frame, 0, 0, rtCanvas.width, rtCanvas.height); }
          catch (e) { /* transient canvas loss; next frame retries */ }
        }
        try { frame.close(); } catch (e) { /* ignore */ }
        st.frames++;
        if (st.lastArrival) st.lat = performance.now() - st.lastArrival;
        if (st.frames === 1) {                 // a decoded frame = healthy link
          rtRetries = 0;
          rtTokenRefreshed = false;
        }
      }

      function configure(moov) {
        const info = rtParseMoov(moov);
        if (!info.avcC) {
          rtFallbackToMse(info.videoFourCC && info.videoFourCC.indexOf("hv") === 0
            ? "Real-time mode is H.264-only (this stream is H.265)"
            : "No H.264 configuration in the stream");
          return false;
        }
        st.trackId = info.trackId;
        st.timescale = info.timescale;
        st.lenSize = (info.avcC[4] & 3) + 1;   // AVCDecoderConfigurationRecord
        const codec = "avc1." +
          [1, 2, 3].map((i) => info.avcC[i].toString(16).padStart(2, "0")).join("");
        const config = { codec: codec, description: info.avcC, optimizeForLatency: true };
        const dec = new VideoDecoder({
          output: onFrame,
          error: (e) => fatal("Decoder error: " + (e && e.message ? e.message : e))
        });
        VideoDecoder.isConfigSupported(config).then((r) => {
          if (!st.dead && r && r.supported === false)
            rtFallbackToMse("Browser cannot decode " + codec);
        }).catch(() => { /* not implemented -> rely on configure()/error() */ });
        try {
          dec.configure(config);
        } catch (e) {
          rtFallbackToMse("Cannot configure decoder (" + codec + ")");
          return false;
        }
        st.decoder = dec;
        setStatus("Real-time (" + label + " stream, " + codec + ")" + audioNote);
        return true;
      }

      function onBox(type, payload) {
        if (type === "moov") {
          configure(payload);
        } else if (type === "moof") {
          st.lastArrival = performance.now();
          const traf = findBox(payload, ["traf"]);
          st.pendingVideo = !!traf && rtTrafTrackId(traf) === st.trackId;
          st.pendingDts = traf ? rtTrafDts(traf) : null;
        } else if (type === "mdat") {
          if (!st.pendingVideo || !st.decoder || st.decoder.state !== "configured") return;
          if (payload.length <= st.lenSize) return;
          const key = rtIsKeyframe(payload, st.lenSize);
          if (!key && !st.sawKey) return;
          if (key) st.sawKey = true;
          const ts = st.pendingDts !== null
            ? Math.round(st.pendingDts * 1000000 / st.timescale)
            : 0;
          try {
            st.decoder.decode(new EncodedVideoChunk({
              type: key ? "key" : "delta", timestamp: ts,
              // copy: the parser's view aliases a buffer we keep slicing
              data: payload.slice()
            }));
            if (st.decoder.decodeQueueSize > st.queueMax)
              st.queueMax = st.decoder.decodeQueueSize;
          } catch (e) {
            fatal("Decode failed: " + (e && e.message ? e.message : e));
          }
        }
      }

      /* incremental box splitter over the chunked HTTP body */
      function push(chunk) {
        const merged = new Uint8Array(st.buf.length + chunk.length);
        merged.set(st.buf, 0);
        merged.set(chunk, st.buf.length);
        st.buf = merged;
        let off = 0, b;
        while (!st.dead && (b = boxAt(st.buf, off))) {
          onBox(b.type, b.payload);
          off += b.size;
        }
        st.buf = off ? st.buf.subarray(off) : st.buf;
        // A never-completing box would otherwise grow without bound (a
        // truncated/corrupt stream, or a proxy mangling the body).
        if (st.buf.length > 16 * 1024 * 1024) {
          fatal("Stream framing lost (oversized box)");
        }
      }

      st.statsTimer = setInterval(() => {
        if (st.dead || !st.decoder) return;
        const fps = st.frames - st.lastFrames;
        st.lastFrames = st.frames;
        setStatus("Real-time (" + label + " stream) · " +
          (st.w ? st.w + "x" + st.h + " · " : "") +
          fps.toFixed(0) + " fps · " + st.frames + " frames · queue " +
          st.decoder.decodeQueueSize + " · render +" + st.lat.toFixed(1) + " ms" +
          audioNote);
      }, 1000);

      const ctrl = new AbortController();
      abortCtrl = ctrl;
      try {
        const res = await fetch(src, { signal: ctrl.signal, cache: "no-store" });
        if (session !== mySession) { try { ctrl.abort(); } catch (e) { /* ignore */ } return; }
        if (!res.ok || !res.body) {
          if (res.status >= 500) { scheduleReconnect("Connect failed: HTTP " + res.status); return; }
          if (res.status === 401 && !rtTokenRefreshed) {
            rtTokenRefreshed = true;
            controlCache = null;
            refreshTimpsToken();
            rtRetries = 0;                   // new failure class, fresh budget
            scheduleReconnect("Stream token expired (timps restarted?) - renewing");
            return;
          }
          rtTeardown();
          running = false;
          await stopStream("Connect failed: HTTP " + res.status +
            (res.status === 401 ? " (timps HTTP auth - open " + b + " once and log in)" : ""));
          return;
        }
        setConnectedUi(true);
        noteProgress();
        console.info("[preview] rt: connected (" + label + " stream)");
        setStatus("Real-time (" + label + " stream) · waiting for a key frame…");
        const rd = res.body.getReader();
        while (true) {
          const { done, value } = await rd.read();
          if (done || st.dead || session !== mySession) break;
          noteProgress();   // the watchdog's liveness signal: bytes off the wire
          push(value);
        }
        if (!st.dead && session === mySession) scheduleReconnect("Stream ended");
      } catch (e) {
        if (st.dead || session !== mySession) return;   // aborted by us
        // The mixed-content hint is only meaningful if we never got a single
        // frame; after that it is just noise on an ordinary mid-stream drop.
        scheduleReconnect("Stream error: " + (e && e.message ? e.message : e) +
          (st.frames === 0 && rtRetries === 0
            ? " - if the web UI runs on HTTPS this is likely blocked mixed content (see page source)"
            : ""));
      }
    }

    const WHEP_MAX_RETRIES = 5;
    let whep = null;                // active peer-connection state, or null
    let whepRetries = 0;            // consecutive reconnect attempts
    let whepTokenRefreshed = false; // one token renewal per healthy run

    // What a 426 from /webrtc/whep actually means, in one sentence, in the two
    // places that have to say it (the option's tooltip and the status line).
    const WHEP_TLS_HINT =
      "This camera requires HTTPS for WebRTC signalling (webrtc.enabled=1) - " +
      "open this page over https:// to use WebRTC.";

    const H264_PROFILE_IDC = { 0: "4200", 1: "4d00", 2: "6400" };
    const H264_PROFILE_NAME = { 0: "Baseline", 1: "Main", 2: "High" };

    function whepAnswerLike(offerSdp, idc) {
      const lines = offerSdp.split(/\r\n|\n/);
      const mi = lines.findIndex((l) => l.indexOf("m=video") === 0);
      if (mi < 0) return null;
      let end = lines.length;
      for (let k = mi + 1; k < lines.length; k++)
        if (lines[k].indexOf("m=") === 0) { end = k; break; }
      const inSec = (n) => n > mi && n < end;

      let pt = null, level = "1f";
      for (const cand of lines[mi].split(" ").slice(3)) {
        const rtp = lines.find((l, n) => inSec(n) && l.indexOf("a=rtpmap:" + cand + " ") === 0);
        if (!rtp || !/H264\/90000/i.test(rtp)) continue;
        const fmtp = lines.find((l, n) => inSec(n) && l.indexOf("a=fmtp:" + cand + " ") === 0);
        if (!fmtp || !/packetization-mode=1/.test(fmtp)) continue;
        const m = fmtp.match(/profile-level-id=[0-9a-f]{4}([0-9a-f]{2})/i);
        if (m) level = m[1];
        pt = cand; break;
      }
      if (!pt) return null;

      const out = [];
      for (let n = 0; n < lines.length; n++) {
        let l = lines[n];
        if (!l) continue;
        if (n === mi) { out.push(lines[mi].split(" ").slice(0, 3).join(" ") + " " + pt); continue; }
        if (inSec(n)) {
          const m = l.match(/^a=(?:rtpmap|fmtp|rtcp-fb):(\d+)/);
          if (m && m[1] !== pt) continue;
          if (idc && l.indexOf("a=fmtp:" + pt + " ") === 0)
            l = "a=fmtp:" + pt + " packetization-mode=1;profile-level-id=" + idc + level;
          if (l === "a=recvonly") l = "a=sendonly";
        }
        if (l === "a=setup:actpass") l = "a=setup:passive";
        out.push(l);
      }
      return out.join("\r\n") + "\r\n";
    }

    // One throwaway negotiation.
    async function whepAnswerAccepted(idc) {
      let pc = null;
      try {
        pc = new RTCPeerConnection({ iceServers: [] });
        pc.addTransceiver("video", { direction: "recvonly" });
        await pc.setLocalDescription(await pc.createOffer());
        const sdp = whepAnswerLike(pc.localDescription.sdp, idc);
        if (!sdp) return null;
        await pc.setRemoteDescription({ type: "answer", sdp: sdp });
        return true;
      } catch (e) {
        return idc ? false : null;
      } finally { if (pc) try { pc.close(); } catch (e) { /* ignore */ } }
    }

    const whepProfileCache = {};
    async function whepProfileNegotiable(prof) {
      const idc = H264_PROFILE_IDC[prof];
      if (!idc) return null;                       // unknown profile: no verdict
      if (idc in whepProfileCache) return whepProfileCache[idc];
      const p = (async () => {
        if (await whepAnswerAccepted(null) !== true) return null;
        return await whepAnswerAccepted(idc);
      })();
      whepProfileCache[idc] = p;
      return p;
    }

    async function refreshWhepOption() {
      if (!HAVE_WEBRTC || !whepOption || !latencySelect) return "unknown";
      const { base: b, tok } = await endpoint();
      const j = await controlSnapshot(b, tok);
      if (!j || !j.caps) return "unknown";
      const w = j.caps.webrtc;
      if (!w) {
        whepOption.remove();
        if (mode === "whep")
          whepFallbackToMse("This camera has no WebRTC/WHEP endpoint", true);
        return "absent";
      }
      if (!w.available) {
        whepOption.disabled = true;
        whepOption.title = "WebRTC is built into this camera but turned off " +
                           "(webrtc.enabled=0)";
        if (mode === "whep")
          whepFallbackToMse("WebRTC is turned off on this camera (webrtc.enabled=0)", true);
        return "off";
      }
      let prof = -1;
      for (const k in (j.video || {})) {
        const v = j.video[k];
        if (v && v.enabled && String(v.codec || "").toLowerCase() === "h264" &&
            typeof v.profile === "number" && v.profile > prof) prof = v.profile;
      }
      if (await whepProfileNegotiable(prof) === false) {
        const msg = "This camera streams H.264 " + H264_PROFILE_NAME[prof] +
                    " profile, which this browser's WebRTC will not negotiate " +
                    "(it accepts Baseline only). Set videoN.profile = 0 on the " +
                    "camera, or use one of the buffered fMP4 options instead.";
        whepOption.disabled = true;
        whepOption.title = msg;
        if (mode === "whep") whepFallbackToMse(msg, true);
        return "profile";
      }

      const ok = (w.enabled | 0) >= 2 || b.slice(0, 6) === "https:";
      whepOption.disabled = false;
      whepOption.title = ok
        ? "Browser-native WebRTC; streams whichever channel webrtc.channel " +
          "names in timps.conf (the main/sub selector does not apply)"
        : WHEP_TLS_HINT;
      return ok ? "ok" : "tls";
    }

    function whepFallbackToMse(why, permanent) {
      mode = "mse";
      const n = parseMargin(lastBufferedValue);
      targetBehindS = n === null ? DEFAULT_MARGIN_S : n;
      localStorage.setItem("ms.latency", lastBufferedValue);
      if (whepOption && permanent) { whepOption.disabled = true; whepOption.title = why; }
      applyModeUi();
      applyModeAudio();
      console.warn("[preview] whep: " + why);
      if (typeof window.showAlert === "function")
        window.showAlert("warning", "WebRTC: " + why + " Falling back to buffered playback.", 12000);
      stopStream(why + " - switched to buffered playback.").then(() => startStream());
    }

    function whepTlsRequired() {
      const httpsUrl = "https://" + host + location.pathname;
      const msg = WHEP_TLS_HINT + " Try " + httpsUrl;
      if (whepOption) whepOption.title = WHEP_TLS_HINT;
      whepFallbackToMse(msg, false);   // raises the toast that carries `msg`
    }

    function whepDelete(resource, token, why) {
      if (!resource) return;
      console.info("[preview] whep: DELETE " + resource + " (" + why + ")");
      try {
        fetch(resource, {
          method: "DELETE",
          keepalive: true,
          cache: "no-store",
          headers: token ? { "X-Timps-Token": token } : {}
        }).then((r) => console.info("[preview] whep: DELETE -> " + r.status))
          .catch((e) => console.warn("[preview] whep: DELETE failed:", e));
      } catch (e) { console.warn("[preview] whep: DELETE threw:", e); }
    }

    // Called from stopStream(), so it runs on EVERY exit from this mode:
    // Disconnect, stream/mode switch, watchdog reconnect and pagehide alike.
    function whepTeardown(why) {
      if (!whep) return;
      const st = whep;
      whep = null;
      st.dead = true;
      if (st.statsTimer) { clearInterval(st.statsTimer); st.statsTimer = null; }
      whepDelete(st.resource, st.token, why || "teardown");
      st.resource = null;
      if (st.pc) { try { st.pc.close(); } catch (e) { /* ignore */ } st.pc = null; }
      // Hand the <video> back to the MSE path.
      try { video.srcObject = null; } catch (e) { /* ignore */ }
    }

    async function startWhepStream(mySession) {
      const { base: b } = await endpoint();
      if (session !== mySession) return;
      const info = await window.timpsTokenInfo;
      if (session !== mySession) return;
      const token = info && info.token ? info.token : "";

      const st = {
        dead: false, pc: null, resource: null, token: token, statsTimer: null,
        bytes: -1, lastBytes: -1, lastAt: 0, audio: false, w: 0, h: 0
      };
      whep = st;

      function scheduleWhepReconnect(msg) {
        if (st.dead || session !== mySession) return;
        whepTeardown("reconnect");
        running = false;
        if (whepRetries >= WHEP_MAX_RETRIES) {
          reconnectPending = false;
          setConnectedUi(false);
          setConnectingUi(false);
          setStatus(msg + " - gave up after " + WHEP_MAX_RETRIES +
                    " attempts. Click Connect to retry.");
          console.warn("[preview] whep: gave up after " + WHEP_MAX_RETRIES +
                       " attempts (" + msg + ") - watchdog may still retry later");
          return;
        }
        const delay = Math.min(8000, 500 * Math.pow(2, whepRetries));
        whepRetries++;
        reconnectPending = true;
        setStatus(msg + " - reconnecting in " + (delay / 1000).toFixed(1) +
                  "s (attempt " + whepRetries + "/" + WHEP_MAX_RETRIES + ")…");
        console.warn("[preview] whep: " + msg + " - retry " + whepRetries + "/" +
                     WHEP_MAX_RETRIES + " in " + delay + "ms");
        setTimeout(() => {
          if (session !== mySession || mode !== "whep") return;
          reconnectPending = false;
          startStream();
        }, delay);
      }

      let pc;
      try {
        pc = new RTCPeerConnection({ iceServers: [] });   // ICE-lite peer: no STUN needed
      } catch (e) {
        whepFallbackToMse("This browser refused to create an RTCPeerConnection", true);
        return;
      }
      st.pc = pc;
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });

      pc.ontrack = (e) => {
        if (st.dead || session !== mySession) return;
        if (!video.srcObject) video.srcObject = new MediaStream();
        video.srcObject.addTrack(e.track);
        if (e.track.kind === "audio") st.audio = true;
        console.info("[preview] whep: ontrack " + e.track.kind);
        // srcObject does not autoplay on its own in every browser; the click
        // on Connect is the gesture that makes this allowed when unmuted.
        try { const p = video.play(); if (p) p.catch(() => { /* autoplay policy */ }); }
        catch (err) { /* ignore */ }
      };
      pc.onconnectionstatechange = () => {
        if (st.dead || session !== mySession) return;
        const s = pc.connectionState;
        console.info("[preview] whep: connectionState=" + s);
        if (s === "connected") { whepRetries = 0; setConnectedUi(true); noteProgress(); }
        else if (s === "failed")
          scheduleWhepReconnect("WebRTC connection failed (ICE/DTLS)");
        else if (s === "disconnected")
          setStatus("WebRTC (WHEP) · link interrupted, waiting…");
      };
      pc.oniceconnectionstatechange = () =>
        console.info("[preview] whep: iceConnectionState=" + pc.iceConnectionState);

      let offer;
      try {
        offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
      } catch (e) {
        if (st.dead || session !== mySession) return;
        scheduleWhepReconnect("Could not build a WebRTC offer: " +
                              (e && e.message ? e.message : e));
        return;
      }
      if (st.dead || session !== mySession) return;

      const url = b + "/webrtc/whep";
      const headers = { "Content-Type": "application/sdp" };
      if (token) headers["X-Timps-Token"] = token;

      let res;
      console.info("[preview] whep: POST " + url + " (" + offer.sdp.length + " byte offer)");
      try {
        res = await fetch(url, { method: "POST", headers: headers,
                                 body: offer.sdp, cache: "no-store" });
      } catch (e) {
        if (st.dead || session !== mySession) return;
        // A POST that never reaches the daemon.
        whepFallbackToMse("WebRTC signalling could not reach " + url + " (" +
          (e && e.message ? e.message : e) +
          ") - camera down, blocked mixed content, or an untrusted camera " +
          "certificate.", false);
        return;
      }
      if (st.dead || session !== mySession) return;
      const answer = await res.text().catch(() => "");
      if (st.dead || session !== mySession) return;

      if (res.status !== 201) {
        console.warn("[preview] whep: signalling -> HTTP " + res.status + " " + answer);
        // A 401 right here is what a timpsd restart looks like: the per-boot
        // token we hold is the previous boot's. Same one-shot renewal the
        // rt/mse paths do.
        if (res.status === 401 && !whepTokenRefreshed) {
          whepTokenRefreshed = true;
          controlCache = null;
          refreshTimpsToken();
          whepRetries = 0;                 // new failure class, fresh budget
          scheduleWhepReconnect("WebRTC token expired (timps restarted?) - renewing");
          return;
        }
        if (res.status === 426) { whepTlsRequired(); return; }
        if (res.status === 404) {
          whepFallbackToMse("This camera's timps serves no WebRTC/WHEP endpoint " +
                            "(USE_WEBRTC=0, or webrtc.enabled=0)", true);
          return;
        }
        if (res.status === 400) {
          // webrtc.c 400s an offer it cannot answer - in practice because the
          // channel webrtc.channel names is not H.264.
          whepFallbackToMse("The camera rejected the WebRTC offer - the stream " +
                            "webrtc.channel names must be H.264", true);
          return;
        }
        if (res.status === 403) {
          whepFallbackToMse("timps refused the WebRTC session (no valid token " +
                            "for /webrtc/whep)", false);
          return;
        }
        if (res.status === 503) {
          scheduleWhepReconnect("All WebRTC sessions on this camera are in use");
          return;
        }
        if (res.status >= 500) {
          scheduleWhepReconnect("WebRTC signalling failed: HTTP " + res.status);
          return;
        }
        whepFallbackToMse("WebRTC signalling failed: HTTP " + res.status + " " +
                          res.statusText, false);
        return;
      }

      // Location is relative ("/webrtc/whep/<id>") - resolve it against the
      // CAMERA, not against the page serving this file.
      const loc = res.headers.get("Location");
      if (loc) { try { st.resource = new URL(loc, b + "/").href; } catch (e) { /* ignore */ } }
      if (!st.resource)
        console.warn("[preview] whep: 201 without a usable Location - teardown " +
                     "will have to rely on the camera's idle timeout");

      try {
        await pc.setRemoteDescription({ type: "answer", sdp: answer });
      } catch (e) {
        if (st.dead || session !== mySession) return;
        scheduleWhepReconnect("The camera's WebRTC answer was rejected: " +
                              (e && e.message ? e.message : e));
        return;
      }
      if (st.dead || session !== mySession) return;
      setConnectedUi(true);
      noteProgress();
      setStatus("WebRTC (WHEP) · negotiating… (stream selected by webrtc.channel " +
                "on the camera, not by the selector above)");

      st.statsTimer = setInterval(async () => {
        if (st.dead || session !== mySession) return;
        let report;
        try { report = await pc.getStats(); } catch (e) { return; }
        if (st.dead || session !== mySession) return;
        let v = null, a = null, tr = null;
        report.forEach((r) => {
          if (r.type === "inbound-rtp" && r.kind === "video") v = r;
          else if (r.type === "inbound-rtp" && r.kind === "audio") a = r;
          else if (r.type === "transport") tr = r;
        });
        const bytes = (v ? v.bytesReceived || 0 : 0) + (a ? a.bytesReceived || 0 : 0);
        if (bytes > st.bytes) { st.bytes = bytes; noteProgress(); }
        if (!v) return;
        const now = performance.now();
        let rate = "";
        if (st.lastBytes >= 0 && now > st.lastAt)
          rate = " · " + formatKbps((bytes - st.lastBytes) * 8 / (now - st.lastAt));
        st.lastBytes = bytes; st.lastAt = now;
        const w = v.frameWidth || 0, h = v.frameHeight || 0;
        if (w && h) { st.w = w; st.h = h; }
        const dtls = tr && tr.dtlsState && tr.dtlsState !== "connected"
                   ? " · dtls " + tr.dtlsState : "";
        setStatus("WebRTC (WHEP)" +
                  (st.w ? " · " + st.w + "x" + st.h : "") +
                  (v.framesPerSecond ? " · " + Math.round(v.framesPerSecond) + " fps" : "") +
                  rate +
                  (st.audio ? " · G.711 audio" : " · no audio") +
                  (v.packetsLost ? " · lost " + v.packetsLost : "") +
                  dtls);
      }, 1000);
    }

    async function startStream(forceVideoOnly = false) {
      if (running) return;
      running = true;
      reconnectPending = false;
      noteProgress();          // fresh stall grace window for this attempt
      const mySession = ++session;   // this attempt owns the player now
      setStatus("Connecting...");
      setConnectingUi(true);
      applyModeUi();
      applyModeAudio();
      if (mode === "rt") return startRtStream(mySession);
      if (mode === "whep") return startWhepStream(mySession);
      return startMseStream(forceVideoOnly, mySession);
    }

    async function startMseStream(forceVideoOnly, mySession) {
      const chn = streamSelect.value === "1" ? "1" : "0";
      const ep = await endpoint();
      const tok = ep.tok;
      const src = base + "/stream.mp4?chn=" + chn + tok;
      const MS = window.ManagedMediaSource || window.MediaSource;
      // Advertise AAC to MSE only if timps is actually muxing it; a video-only
      // stream (PCM audio) with an mp4a-typed SourceBuffer shows no video.
      const wantAac = forceVideoOnly ? false : await streamHasAac(base, tok);
      if (session !== mySession) return;   // superseded during the /control probe
      const mime = pickMime(MS, wantAac);

      if (!MS || !mime) {
        // no MSE (e.g. old iOS Safari): let the <video> try progressive mp4
        video.src = src;
        setConnectedUi(true);
        setStatus("MSE unavailable - direct playback attempt");
        return;
      }

      const ms = new MS();
      mediaSource = ms;
      video.src = URL.createObjectURL(ms);

      // Buffered-mode twin of startRtStream()'s scheduleReconnect().
      function scheduleMseReconnect(msg) {
        if (session !== mySession) return;
        if (abortCtrl) {
          try { abortCtrl.abort(); } catch (e) { /* ignore */ }
          abortCtrl = null;
        }
        try { if (ms.readyState === "open") ms.endOfStream(); } catch (e) { /* ignore */ }
        if (mediaSource === ms) mediaSource = null;
        running = false;
        if (mseRetries >= MSE_MAX_RETRIES) {
          reconnectPending = false;
          setConnectedUi(false);
          setConnectingUi(false);
          setStatus(msg + " - gave up after " + MSE_MAX_RETRIES +
                    " attempts. Click Connect to retry.");
          console.warn("[preview] mse: gave up after " + MSE_MAX_RETRIES +
                       " attempts (" + msg + ") - watchdog may still retry later");
          return;
        }
        const delay = Math.min(8000, 500 * Math.pow(2, mseRetries));
        mseRetries++;
        reconnectPending = true;
        setStatus(msg + " - reconnecting in " + (delay / 1000).toFixed(1) +
                  "s (attempt " + mseRetries + "/" + MSE_MAX_RETRIES + ")…");
        console.warn("[preview] mse: " + msg + " - retry " + mseRetries + "/" +
                     MSE_MAX_RETRIES + " in " + delay + "ms");
        setTimeout(() => {
          // a stop / stream switch / mode switch in the meantime bumps the
          // session token, and that silently cancels this retry
          if (session !== mySession || mode !== "mse") return;
          reconnectPending = false;
          startStream();
        }, delay);
      }

      ms.addEventListener("sourceopen", async () => {
        if (session !== mySession) return;   // superseded while opening
        try { ms.duration = Infinity; } catch (e) { /* Safari live-MSE hint */ }
        let sb;
        try {
          sb = ms.addSourceBuffer(mime);
        } catch (e) {
          video.src = src;
          return;
        }
        sb.mode = "sequence";
        sb.addEventListener("error", () => {
          if (session !== mySession || forceVideoOnly || !/mp4a/.test(mime)) return;
          stopStream("Retrying video-only…").then(() => startStream(true));
        });
        let dead = false;
        const q = [];
        let busy = false;

        const stop = () => {
          dead = true;
          try { if (ms.readyState === "open") ms.endOfStream(); } catch (e) { /* ignore */ }
        };
        // drop buffered data older than ~10s behind playback so the
        // SourceBuffer never fills up during a long-running live stream
        const evict = () => {
          try {
            if (sb.buffered.length) {
              const s = sb.buffered.start(0), e = video.currentTime - 10;
              if (e > s + 4 && !sb.updating) sb.remove(s, e);
            }
          } catch (e) { /* ignore */ }
        };
        const pump = () => {
          if (dead || busy || sb.updating || ms.readyState !== "open" || !q.length) return;
          busy = true;
          const c = q[0];
          try { sb.appendBuffer(c); q.shift(); }
          catch (e) {
            busy = false;
            if (e.name === "QuotaExceededError") evict(); else stop();
          }
        };
        sb.addEventListener("updateend", () => {
          busy = false;
          // MSE accepted real media = healthy link, the buffered-mode analog of rt's "first decoded frame resets rtRetries".
          if (session === mySession) { mseRetries = 0; mseTokenRefreshed = false; }
          if (video.buffered.length) {
            if (video.currentTime < video.buffered.start(0)) video.currentTime = video.buffered.start(0);
            const end = video.buffered.end(video.buffered.length - 1);
            const behind = end - video.currentTime;
            const target = targetBehindS;
            if (behind > target + 3.5) video.currentTime = end - target;
            else video.playbackRate = behind > target ? Math.min(1.3, 1 + (behind - target) * 0.5) : 1;
          }
          evict();
          pump();
        });
        sb.addEventListener("error", stop);

        const ctrl = new AbortController();
        abortCtrl = ctrl;
        try {
          const res = await fetch(src, { signal: ctrl.signal, cache: "no-store" });
          if (session !== mySession) {           // superseded mid-connect
            try { ctrl.abort(); } catch (e) { /* ignore */ }
            stop();
            return;
          }
          if (!res.ok || !res.body) {
            stop();
            if (res.status === 401 && !mseTokenRefreshed) {
              mseTokenRefreshed = true;
              controlCache = null;
              refreshTimpsToken();
              mseRetries = 0;              // new failure class, fresh budget
              scheduleMseReconnect("Stream token expired (timps restarted?) - renewing");
              return;
            }
            if (res.status >= 500) {
              scheduleMseReconnect("Connect failed: HTTP " + res.status);
              return;
            }
            await stopStream("Connect failed: HTTP " + res.status +
              (res.status === 401 ? " (timps HTTP auth - open " + base + " once and log in)" : ""));
            return;
          }
          setConnectedUi(true);
          noteProgress();
          console.info("[preview] mse: connected (" + (chn === "1" ? "sub" : "main") + " stream)");
          setStatus("Connected (" + (chn === "1" ? "sub" : "main") + " stream)");
          const rd = res.body.getReader();
          while (true) {
            const { done, value } = await rd.read();
            if (done || dead || session !== mySession) break;
            noteProgress();   // the watchdog's liveness signal: bytes off the wire
            q.push(value);
            pump();
          }
          if (session === mySession && running && !dead)
            scheduleMseReconnect("Stream ended");
        } catch (e) {
          if (session === mySession && running) {
            scheduleMseReconnect("Stream error: " + (e && e.message ? e.message : e) +
              " - if the web UI runs on HTTPS this is likely blocked mixed content (see page source)");
          }
        }
        stop();
        // only the still-current session may flip the UI back to disconnected
        if (session === mySession && running) {
          setConnectedUi(false);
          setConnectingUi(false);
          running = false;
        }
      });
    }

    streamSelect.addEventListener("change", () => {
      sessionStorage.setItem("ms.stream", streamSelect.value || "0");
      // main and sub can run different codecs, so the real-time gate is
      // per-channel; this may also bounce an active rt session back to MSE
      refreshRtOption();
      if (mode === "whep") {
        setStatus("WebRTC streams the channel webrtc.channel names on the " +
                  "camera; the main/sub selector applies to the buffered and " +
                  "real-time players only.");
        return;
      }
      if (running) {
        stopStream("Switching stream...").then(() => startStream());
      }
    });

    connectButton.addEventListener("click", () => {
      // wantStream is the watchdog's "should anything be playing at all?"
      // question: a deliberate Disconnect must not be undone 30s later.
      if (running) { wantStream = false; rtRetries = 0; mseRetries = 0; whepRetries = 0; stopStream(); }
      else {
        wantStream = true;
        rtRetries = 0; rtTokenRefreshed = false;
        mseRetries = 0; mseTokenRefreshed = false;
        whepRetries = 0; whepTokenRefreshed = false;
        startStream();
      }
    });

    // =================================================================== Recovery: two layers, deliberately.

    function logState(tag) {
      const idle = lastProgressAt ? ((performance.now() - lastProgressAt) / 1000).toFixed(1) + "s" : "n/a";
      console.info("[preview] " + tag + ": hidden=" + document.hidden +
                   " running=" + running + " want=" + wantStream +
                   " mode=" + mode + " pendingRetry=" + reconnectPending +
                   " sinceLastData=" + idle);
    }

    // Shared body of the pageshow/visibilitychange handlers.
    function resumeCheck(tag, evenIfHidden) {
      logState(tag);
      if (document.hidden && !evenIfHidden) return;
      if (!document.hidden) { wdWasHidden = false; wdVisibleSince = performance.now(); }
      if (bootPending) { console.info("[preview] " + tag + ": boot still resolving, deferring"); return; }
