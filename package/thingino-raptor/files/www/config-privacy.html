<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · Privacy</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
  <style>
    .color-swatch{width:32px;padding:2px;cursor:pointer;border:1px solid var(--bs-border-color)}
    .color-picker-group{width:150px}
    .alpha-slider{width:48px;height:24px;cursor:pointer}
  </style>
</head>

<body id="page-config-privacy">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container">
    <div data-app-controls></div>

    <section>
      <h3 class="mb-3">Privacy</h3>
      <p class="text-secondary small mb-3">
        Privacy mode covers every stream with a solid color, shows a text on
        top of it and mutes the microphone.
      </p>

      <div class="col-lg-8">
        <div class="card bg-dark-subtle mb-3 p-3">
          <h6 class="mb-2">Startup</h6>
          <p class="form-switch mb-0">
            <input type="checkbox" id="privacy_on_boot" role="switch" class="form-check-input">
            <label for="privacy_on_boot" class="form-check-label small">Turn privacy mode on at boot</label>
          </p>
        </div>

        <div class="card bg-dark-subtle mb-3 p-3">
          <h6 class="mb-2">Cover</h6>
          <div>
            <label class="form-label small mb-0">Color</label>
            <div class="input-group input-group-sm color-picker-group">
              <span class="input-group-text color-swatch" id="swatch_cover" title="Pick color">&nbsp;</span>
              <input type="color" id="picker_cover" class="d-none">
              <input type="text" id="privacy_cover_color" class="form-control form-control-sm font-monospace"
                placeholder="#000000ff" pattern="#?[0-9a-fA-F]{8}" maxlength="9">
            </div>
            <input type="range" id="alpha_cover" class="alpha-slider" min="0" max="255" value="255" title="Alpha">
          </div>
        </div>

        <div class="card bg-dark-subtle mb-3 p-3">
          <h6 class="mb-2">Text</h6>
          <div class="row g-2 mb-2">
            <div class="col">
              <label class="form-label small mb-0" for="privacy_text">Text</label>
              <input type="text" id="privacy_text" class="form-control form-control-sm" placeholder="Privacy Mode">
            </div>
            <div class="col-auto" style="min-width:90px">
              <label class="form-label small mb-0" for="privacy_font_size">Font size</label>
              <input type="number" id="privacy_font_size" class="form-control form-control-sm" min="8" max="96" step="1">
            </div>
            <div class="col-auto" style="min-width:90px">
              <label class="form-label small mb-0" for="privacy_max_chars">Max chars</label>
              <input type="number" id="privacy_max_chars" class="form-control form-control-sm" min="1" max="128" step="1">
            </div>
            <div class="col-auto" style="min-width:150px">
              <label class="form-label small mb-0" for="privacy_position">Position</label>
              <select class="form-select form-select-sm" data-position-for="privacy_position" aria-label="Position">
                <option value="" disabled>Default</option>
                <option value="top_left">Top left</option>
                <option value="top_center">Top center</option>
                <option value="top_right">Top right</option>
                <option value="left_center">Left center</option>
                <option value="center">Center</option>
                <option value="right_center">Right center</option>
                <option value="bottom_left">Bottom left</option>
                <option value="bottom_center">Bottom center</option>
                <option value="bottom_right">Bottom right</option>
                <option value="custom">Custom (x,y)</option>
              </select>
              <input type="text" id="privacy_position" class="form-control form-control-sm mt-1 d-none" placeholder="x,y">
            </div>
          </div>
          <div class="d-flex align-items-end gap-2 flex-wrap">
            <div>
              <label class="form-label small mb-0">Fill</label>
              <div class="input-group input-group-sm color-picker-group">
                <span class="input-group-text color-swatch" id="swatch_fill" title="Pick color">&nbsp;</span>
                <input type="color" id="picker_fill" class="d-none">
                <input type="text" id="privacy_fill_color" class="form-control form-control-sm font-monospace"
                  placeholder="#ffffffff" pattern="#?[0-9a-fA-F]{8}" maxlength="9">
              </div>
              <input type="range" id="alpha_fill" class="alpha-slider" min="0" max="255" value="255" title="Alpha">
            </div>
            <div>
              <label class="form-label small mb-0">Outline</label>
              <div class="input-group input-group-sm color-picker-group">
                <span class="input-group-text color-swatch" id="swatch_outline" title="Pick color">&nbsp;</span>
                <input type="color" id="picker_outline" class="d-none">
                <input type="text" id="privacy_stroke_color" class="form-control form-control-sm font-monospace"
                  placeholder="#000000ff" pattern="#?[0-9a-fA-F]{8}" maxlength="9">
              </div>
              <input type="range" id="alpha_outline" class="alpha-slider" min="0" max="255" value="255" title="Alpha">
            </div>
          </div>
        </div>

        <p class="text-secondary small">
          The startup option applies at the next boot. Cover and text changes
          are saved to /etc/raptor.conf, <a href="/x/reboot.cgi" class="confirm" data-confirm="Reboot the camera now?">reboot the camera</a>
          to apply them.
        </p>
        <button type="button" id="save-privacy" class="btn btn-primary">
          <i class="bi bi-floppy me-1"></i> Save configuration
        </button>
      </div>
    </section>
  </div>
</main>

<footer data-app-footer></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/privacy-screen.js"></script>
</body>
</html>
