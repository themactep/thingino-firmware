# GPIO Configuration
# These GPIOs will be set on device boot.
# Each line follows the format:
# [number, 0-192] [action] [argument, optional] [description, optional]
#
# Actions:
#   high            set the pin high
#   low             set the pin low
#   input           configure the pin as input
#   drive <level>   set drive strength: 0=2mA, 1=4mA, 2=8mA, 3=12mA
#   bias <mode>     set pull resistor: up, down, none
#
# Examples:
# 10 high          # Set GPIO 10 to high
# 58 low           # Set GPIO 58 to low
# 42 input         # Configure GPIO 42 as input
# 47 drive 3       # Set GPIO 47 drive strength to 12mA
# 49 bias none     # Disable the pull resistor on GPIO 49

