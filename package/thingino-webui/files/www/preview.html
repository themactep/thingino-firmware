<script>
/**
 * SEI OSD Overlay Renderer — SVG-based.
 * Fetches JSON from prudynt every 2s and renders OSD as SVG <text>
 * elements over the MJPEG preview.
 */
(function () {
  'use strict';
  var OVERLAY_ID = 'sei-osd-overlay', IMG_ID = 'preview';
  var POLL_URL = 'http://' + window.location.hostname + ':8080/api/v1/osd-sei';
  var POLL_MS = 2000, timer = null;

  function pcol(h, dflt) {
    if (!h || h.length < 7) return dflt || '#ffffff';
    return h.slice(0,7);
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function repaint() {
    window._seiRepaint = repaint;
    var img = document.getElementById(IMG_ID);
    var svg = document.getElementById(OVERLAY_ID);
    if (!img || !svg) return;

    // Apply user visual settings over SSE defaults
    try {
      var vis = JSON.parse(localStorage.getItem('sei-osd-settings') || '{}');
      if (vis.fs) svg.dataset.fs = vis.fs;
      if (vis.stw) svg.dataset.stw = vis.stw;
      if (vis.fc) { var t = svg.querySelectorAll('text'); for (var i=0;i<t.length;i++) t[i].setAttribute('fill', vis.fc); }
      if (vis.sc) { var t = svg.querySelectorAll('text'); for (var i=0;i<t.length;i++) t[i].setAttribute('stroke', vis.sc); }
    } catch(_) {}

    var cw = img.clientWidth, ch = img.clientHeight;
    if (!cw || !ch || !svg.dataset.sw) return;
    var sw = parseFloat(svg.dataset.sw), sh = parseFloat(svg.dataset.sh);
    var rot = parseInt(svg.dataset.rot) || 0;
    var sx = cw / (sw || 1), sy = ch / (sh || 1);
    var fs = parseInt(svg.dataset.fs) || 16;
    var fsOrig = parseInt(svg.dataset.fsOrig) || fs;
    var stw = svg.dataset.stw || '1.5';
    var fw = svg.dataset.fw || 'normal';
    var fscale = fs / (fsOrig || 1);

    img.style.transform = rot ? 'rotate(' + rot + 'deg)' : '';
    var frame = document.getElementById('frame');
    if (frame) frame.style.minHeight = (rot === 90 || rot === 270) ? cw + 'px' : '';

    var vw, vh;
    if (rot === 90 || rot === 270) {
      vw = ch; vh = cw;
      svg.style.left = ((cw - ch) / 2) + 'px'; svg.style.top = '0';
      img.style.marginTop = ((cw - ch) / 2) + 'px';
    } else {
      vw = cw; vh = ch;
      svg.style.left = '0'; svg.style.top = '0';
      img.style.marginTop = '';
    }
    svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
    svg.setAttribute('width', vw);
    svg.setAttribute('height', vh);

    var texts = svg.querySelectorAll('text');
    for (var i = 0; i < texts.length; i++) {
      var c = texts[i];
      var rx = parseFloat(c.dataset.rx)||0, ry = parseFloat(c.dataset.ry)||0;
      var rw = parseFloat(c.dataset.rw)||0, rh = parseFloat(c.dataset.rh)||0;
      rw *= fscale; rh *= fscale;
      var x, y, anchor, baseline;
      if (rx > 0)      { x = rx * sx;      anchor = 'start'; }
      else if (rx < 0) { x = vw + rx * sx; anchor = 'end'; }
      else             { x = vw / 2;       anchor = 'middle'; }
      if (ry > 0)      { y = ry * sy;      baseline = 'hanging'; }
      else if (ry < 0) { y = vh + ry * sy; baseline = 'text-after-edge'; }
      else             { y = vh / 2;       baseline = 'central'; }
      c.setAttribute('x', x);
      c.setAttribute('y', y);
      c.setAttribute('text-anchor', anchor);
      c.setAttribute('dominant-baseline', baseline);
      c.setAttribute('font-size', fs);
      c.setAttribute('font-weight', fw);
      c.setAttribute('stroke-width', stw);
    }

    var fsi = document.getElementById('preview_fullsize');
    if (fsi && fsi.src && fsi.src.indexOf('nostream') === -1) {
      fsi.style.transform = rot ? 'rotate(' + rot + 'deg)' : '';
    }
  }

  function update(d) {
      var svg = document.getElementById(OVERLAY_ID);
      var frame = document.getElementById('frame');
      var img = document.getElementById(IMG_ID);
      if (!img || !frame) return;

      var structKey = '';
      for (var i = 0; i < d.elements.length; i++) {
        structKey += d.elements[i].t + ',' + d.elements[i].x + ',' + d.elements[i].y + ',' + d.elements[i].w + ',' + d.elements[i].h + ';';
      }
      var rebuild = !svg || svg.dataset.seiHash !== structKey;

      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.id = OVERLAY_ID;
        svg.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:10;';
        frame.appendChild(svg);
      }

      if (rebuild) {
        var h = '';
        for (var i = 0; i < d.elements.length; i++) {
          var el = d.elements[i];
          h += '<text data-rx="'+el.x+'" data-ry="'+el.y+'" data-rw="'+el.w+'" data-rh="'+el.h+'" data-sei-type="'+el.t+'" fill="'+pcol(el.color,'#ffffff')+'" stroke="'+pcol(el.stroke,'#000000')+'">'+esc(el.text)+'</text>';
        }
        svg.innerHTML = h;
        svg.dataset.sw = d.sw || 0;
        svg.dataset.sh = d.sh || 0;
        svg.dataset.rot = d.rotation || 0;
        svg.dataset.seiHash = structKey;
        if (d.sw && d.sh) {
          img.setAttribute('width', d.sw);
          img.setAttribute('height', d.sh);
        }
        if (d.elements.length) {
          svg.dataset.fs = d.elements[0].fs || 16;
          svg.dataset.fsOrig = d.elements[0].fs || 16;
        }
      } else {
        var texts = svg.querySelectorAll('text');
        for (var i = 0; i < texts.length && i < d.elements.length; i++) {
          if (texts[i].dataset.seiPrev !== d.elements[i].text) {
            texts[i].textContent = d.elements[i].text;
            texts[i].dataset.seiPrev = d.elements[i].text;
          }
        }
      }
      repaint();
  }

  function poll() {
    // Only render when OSD is enabled (last known config state)
    if (!window._seiOsdEnabled) {
      var svg = document.getElementById(OVERLAY_ID);
      if (svg) svg.style.display = 'none';
      return;
    }
    fetch(POLL_URL, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.elements && d.elements.length) {
          var svg = document.getElementById(OVERLAY_ID);
          if (svg) svg.style.display = '';
          update(d);
        }
      })
      .catch(function () {});
  }

  function start() {
    if (timer) return;
    poll();
    timer = setInterval(poll, POLL_MS);
    window.addEventListener('resize', repaint);
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', start);
  else
    start();
})();
</script>

<!-- OSD Settings Modal -->
<div class="modal fade" id="osdModal" tabindex="-1" aria-labelledby="osdModalLabel" aria-hidden="true">

    <div class="modal-content">

          <input type="checkbox" id="burnin-enabled" role="switch" class="form-check-input">
          <label for="burnin-enabled" class="form-check-label small">Enabled</label>
        </p>
        <div class="d-flex align-items-center gap-3 mb-2">
          <div class="d-flex align-items-center gap-1 flex-fill">
            <span class="small text-muted text-nowrap">Format</span>
            <input type="text" id="burnin-format" class="form-control form-control-sm" placeholder="%F %T">
          </div>
          <div class="d-flex align-items-center gap-1 flex-fill">
            <span class="small text-muted text-nowrap">Scale</span>
            <select class="form-select form-select-sm flex-fill" id="burnin-scale">
              <option value="0">auto</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
            </select>

        <div class="d-flex align-items-center gap-3 mb-2">

              <span class="input-group-text color-swatch" id="modal-swatch-fill" title="Pick color">&nbsp;</span>
              <input type="color" id="modal-picker-fill" class="d-none">
              <input type="text" id="burnin-fill-color" class="form-control form-control-sm font-monospace"
                placeholder="#ffffffff" pattern="#?[0-9a-fA-F]{8}" maxlength="9">
            </div>
            <input type="range" id="alpha-fill" class="alpha-slider" min="0" max="255" value="255" title="Alpha">
          </div>

              <span class="input-group-text color-swatch" id="modal-swatch-outline" title="Pick color">&nbsp;</span>

<script>
(function(){
  var STORAGE_KEY = 'sei-osd-settings';
  var API = '/x/json-prudynt.cgi';
  var TYPES = ['text','gain','hostname','ipaddress','timestamp','uptime'];
  var DEFAULTS = {
    text: {format:'', position:'10,10'},
    gain: {format:'%s', position:'10,-10'},
    hostname: {format:'%s', position:'0,10'},
    ipaddress: {format:'%s', position:'0,30'},
    timestamp: {format:'%F %T', position:'10,10'},
    uptime: {format:'%02lu:%02lu:%02lu', position:'-10,10'}
  };

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(_) { return {}; }
  }
  function saveSettings(s) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
    catch(e) {}
  }

  function createRow(name, type, format, position) {
    var row = document.createElement('div');
    row.className = 'osd-el-row d-flex gap-1 align-items-end mb-1';
    row.innerHTML =
      '<input class="form-control form-control-sm elem-name" placeholder="id" style="flex:0 0 100px" value="' + (name||'') + '">' +
      '<select class="form-select form-select-sm elem-type" style="flex:0 0 150px">' +
        TYPES.map(function(t){ return '<option value="'+t+'"' + (t===type?' selected':'') + '>'+t+'</option>'; }).join('') +
      '</select>' +
      '<input class="form-control form-control-sm elem-format" placeholder="format" style="flex:1 1 auto" value="' + (format||'') + '">' +
      '<input class="form-control form-control-sm elem-position" placeholder="x,y" style="flex:0 0 70px" value="' + (position||'') + '">' +
      '<button class="btn btn-outline-danger btn-sm elem-remove flex-shrink-0" title="Remove">&times;</button>';
    row.querySelector('.elem-type').addEventListener('change', function(){
      var d = DEFAULTS[this.value];
      row.querySelector('.elem-format').value = d.format;
      row.querySelector('.elem-position').value = d.position;
    });
    row.querySelector('.elem-remove').addEventListener('click', function(){ row.remove(); });
    return row;
  }

  function collectElements() {
    var elems = {};
    document.querySelectorAll('#osd-elements-list .osd-el-row').forEach(function(row){
      var name = row.querySelector('.elem-name').value.trim();
      if (!name) return;
      elems[name] = {
        type: row.querySelector('.elem-type').value,
        format: row.querySelector('.elem-format').value,
        position: row.querySelector('.elem-position').value
      };
    });
    return elems;
  }

  function loadElements(elems) {
    var list = document.getElementById('osd-elements-list');
    list.innerHTML = '';
    if (!elems) return;
    Object.keys(elems).forEach(function(name){
      var el = elems[name];
      list.appendChild(createRow(name, el.type, el.format, el.position));
    });
  }

  function loadOsdConfig() {
    fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({osd:{enabled:null,elements:null,burnin:{enabled:null,format:null,background:null,scale:null,fill_color:null,outline_color:null}}})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.enabled !== undefined) {
        document.getElementById('osd-enabled').checked = d.enabled !== false;
        window._seiOsdEnabled = d.enabled !== false;
      }
      loadElements(d.elements);
      // Burn-in
      if (d.burnin) {
        if (d.burnin.enabled !== undefined) document.getElementById('burnin-enabled').checked = d.burnin.enabled !== false;
        if (d.burnin.format !== undefined && d.burnin.format !== null) document.getElementById('burnin-format').value = d.burnin.format;
        if (d.burnin.background !== undefined) document.getElementById('burnin-background').checked = d.burnin.background !== false;
        if (d.burnin.scale !== undefined && d.burnin.scale !== null) document.getElementById('burnin-scale').value = d.burnin.scale;
        var fc = document.getElementById('burnin-fill-color');
        var oc = document.getElementById('burnin-outline-color');
        var sf = document.getElementById('modal-swatch-fill');
        var so = document.getElementById('modal-swatch-outline');
        if (d.burnin.fill_color !== undefined && d.burnin.fill_color !== null) fc.value = d.burnin.fill_color; else fc.value = '#ffffffff';
        if (d.burnin.outline_color !== undefined && d.burnin.outline_color !== null) oc.value = d.burnin.outline_color; else oc.value = '#000000ff';
        updateSwatch(fc, sf);
        updateSwatch(oc, so);
        var v = fc.value.trim(); if (v && /^#?[0-9a-fA-F]{8}$/.test(v)) { if (v[0] !== '#') v = '#' + v; document.getElementById('alpha-fill').value = parseInt(v.substring(7, 9), 16); }
        v = oc.value.trim(); if (v && /^#?[0-9a-fA-F]{8}$/.test(v)) { if (v[0] !== '#') v = '#' + v; document.getElementById('alpha-outline').value = parseInt(v.substring(7, 9), 16); }
      }
    }).catch(function(){});
  }

  // Load config on page start to set initial _seiOsdEnabled flag
  loadOsdConfig();

  // Wire modal color picker swatches.
  function updateSwatch(input, swatch) {
    var v = input.value.trim();
    if (v && /^#?[0-9a-fA-F]{8}$/.test(v)) {
      if (v[0] !== '#') v = '#' + v;
      var r = parseInt(v.substring(1, 3), 16);
      var g = parseInt(v.substring(3, 5), 16);
      var b = parseInt(v.substring(5, 7), 16);
      var a = parseInt(v.substring(7, 9), 16) / 255;
      swatch.style.backgroundColor = 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
      swatch.style.opacity = '';
    } else {
      swatch.style.backgroundColor = '';
      swatch.style.opacity = '';
    }
  }
  (function(){
    var fc = document.getElementById('burnin-fill-color');
    var oc = document.getElementById('burnin-outline-color');
    var sf = document.getElementById('modal-swatch-fill');
    var so = document.getElementById('modal-swatch-outline');
    var pf = document.getElementById('modal-picker-fill');
    var po = document.getElementById('modal-picker-outline');
    var af = document.getElementById('alpha-fill');
    var ao = document.getElementById('alpha-outline');
    function wire(swatch, picker, input, alphaSlider) {
      swatch.addEventListener('click', function(){ picker.click(); });
      picker.addEventListener('input', function(){
        var cur = input.value.trim(), alpha = 'ff';
        if (cur && /^#?[0-9a-fA-F]{8}$/.test(cur)) { if (cur[0] !== '#') cur = '#' + cur; alpha = cur.substring(7, 9); }
        input.value = picker.value + alpha;
        updateSwatch(input, swatch);
      });
      input.addEventListener('input', function(){
        updateSwatch(input, swatch);
        var v = input.value.trim();
        if (v && /^#?[0-9a-fA-F]{8}$/.test(v)) { if (v[0] !== '#') v = '#' + v; alphaSlider.value = parseInt(v.substring(7, 9), 16); }
      });
      alphaSlider.addEventListener('input', function(){
        var v = input.value.trim();
        if (!v || !/^#?[0-9a-fA-F]{8}$/.test(v)) {
          if (v && /^#?[0-9a-fA-F]{3,6}$/.test(v)) v = v + 'ff';
          else v = '#ffffff';
          if (v[0] !== '#') v = '#' + v;
        } else {
          if (v[0] !== '#') v = '#' + v;
        }
        var alpha = ('0' + parseInt(alphaSlider.value, 10).toString(16)).slice(-2);
        input.value = v.substring(0, 7) + alpha;
        updateSwatch(input, swatch);
      });
    }
    wire(sf, pf, fc, af);
    wire(so, po, oc, ao);
  })();

  // Restore visual settings
  function restoreVisuals(){
    var s = loadSettings();
    var svg = document.getElementById('sei-osd-overlay');
    if (!svg || !svg.querySelector('text')) { setTimeout(restoreVisuals, 200); return; }
    if (s.fs) { svg.dataset.fs = s.fs; }
    if (s.stw) svg.dataset.stw = s.stw;
    if (s.fs || s.stw || s.fc || s.sc) {
      var texts = svg.querySelectorAll('text');
      for (var i=0;i<texts.length;i++) {
        if (s.fs) texts[i].setAttribute('font-size', s.fs);
        if (s.stw) texts[i].setAttribute('stroke-width', s.stw);
        if (s.fc) texts[i].setAttribute('fill', s.fc);
        if (s.sc) texts[i].setAttribute('stroke', s.sc);
      }
      if (window._seiRepaint) window._seiRepaint();
    }
  }
  restoreVisuals();

  document.getElementById('preview-osd').addEventListener('click', function(){
    loadOsdConfig();
    var s = loadSettings();
    document.getElementById('osd-fontsize').value = s.fs || 16;
    document.getElementById('osd-stroke').value = s.stw || 1;
    document.getElementById('osd-color').value = s.fc || '#ffffff';
    document.getElementById('osd-stroke-color').value = s.sc || '#000000';
    new bootstrap.Modal('#osdModal').show();
  });

  document.getElementById('osd-add-element').addEventListener('click', function(){
    document.getElementById('osd-elements-list').appendChild(createRow('', 'text', '', ''));
  });

  // Live preview: apply visual settings immediately when controls change
  function applyVisualsLive() {
    var svg = document.getElementById('sei-osd-overlay');
    if (!svg) return;
    var fs = document.getElementById('osd-fontsize').value;
    var stw = document.getElementById('osd-stroke').value;
    var fc = document.getElementById('osd-color').value;
    var sc = document.getElementById('osd-stroke-color').value;
    svg.dataset.fs = fs;
    svg.dataset.stw = stw;
    var texts = svg.querySelectorAll('text');
    for (var i = 0; i < texts.length; i++) {
      texts[i].setAttribute('font-size', fs);
      texts[i].setAttribute('stroke-width', stw);
      texts[i].setAttribute('fill', fc);
      texts[i].setAttribute('stroke', sc);
    }
    if (window._seiRepaint) window._seiRepaint();
  }

  ['osd-fontsize','osd-stroke','osd-color','osd-stroke-color'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', applyVisualsLive);
    document.getElementById(id).addEventListener('change', applyVisualsLive);
  });

  document.getElementById('osd-save').addEventListener('click', async function(){
    var btn = document.getElementById('osd-save');
    var confirmed = await confirm('Save OSD elements to /etc/prudynt.json?');
    if (!confirmed) return;
    btn.disabled = true;
    try {
      var payload = { osd: {
        enabled: document.getElementById('osd-enabled').checked,
        elements: collectElements(),
        burnin: {
          enabled: document.getElementById('burnin-enabled').checked,
          format: document.getElementById('burnin-format').value,
          background: document.getElementById('burnin-background').checked,
          scale: parseInt(document.getElementById('burnin-scale').value, 10),
          fill_color: document.getElementById('burnin-fill-color').value.trim() || undefined,
          outline_color: document.getElementById('burnin-outline-color').value.trim() || undefined
        }
      }, action: { save_config: null } };
      var r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      var msg = await r.json();
      if (msg.action && msg.action.save_config === 'ok') {
        if (typeof showAlert === 'function') showAlert('success', 'OSD configuration saved.', 4000);
        window._seiOsdEnabled = document.getElementById('osd-enabled').checked;
        bootstrap.Modal.getInstance('#osdModal').hide();
      }
    } catch(e) {
      if (typeof showAlert === 'function') showAlert('danger', 'Failed: ' + e.message, 6000);
    } finally { btn.disabled = false; }

    // Save visual settings locally
    saveSettings({
      fs: document.getElementById('osd-fontsize').value,
      stw: document.getElementById('osd-stroke').value,
      fc: document.getElementById('osd-color').value,
      sc: document.getElementById('osd-stroke-color').value
    });
    var svg = document.getElementById('sei-osd-overlay');
    if (svg) {
      svg.dataset.fs = document.getElementById('osd-fontsize').value;
      svg.dataset.stw = document.getElementById('osd-stroke').value;
      var fc = document.getElementById('osd-color').value;
      var sc = document.getElementById('osd-stroke-color').value;
      var texts = svg.querySelectorAll('text');
      for (var i=0;i<texts.length;i++) {
        texts[i].setAttribute('font-size', svg.dataset.fs);
        texts[i].setAttribute('stroke-width', svg.dataset.stw);
        texts[i].setAttribute('fill', fc);
        texts[i].setAttribute('stroke', sc);
      }
      if (window._seiRepaint) window._seiRepaint();
    }
  });
})();
</script>
