# Eufy T8416 (T40XP): sc830ai sits on I2C adapter 1 / CSI0, not on the
# default adapter 0. Without these keys timps passes adapter 0 to
# IMP_ISP_AddSensor and the driver probes 0x30 on i2c0 (nothing there).
sensor.i2c_adapter = 1
sensor.mclk = 1
sensor.rst_gpio = 91
# Working values of the 2026-10-13 run (recovered from the old overlay):
sensor.i2c_addr = 0x30
sensor.fps = 20
sensor.width = 3840
sensor.height = 2160
sensor.video_interface = 0
sensor.default_boot = 4
sensor.pwdn_gpio = -1
video0.fps = 20
video1.fps = 20
image.anti_flicker = 1
