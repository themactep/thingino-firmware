# O-KAM QC3 (T23DL gc1084, IVDC direct mode): sensor at 25 fps like the encoders.
# Without it the sensor runs 30 fps and the sub channel misses buffers (Lu-Fi/openimp#816).
sensor.fps = 25

# 32 MB board: at most ~1 s of video (3 Mbit/s) kept per slow client, the rest is dropped
# instead of filling RAM (timps >= 636415a; default 2048).
general.client_queue_kb = 384
