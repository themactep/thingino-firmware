# WebRTC/WHEP on the preview port. 2 rather than 1: the WebUI is served over
# plain http on this camera, and 1 would answer 426 to its signalling POST.
webrtc.enabled = 2

# JPEG for /snapshot.jpg and /stream.mjpeg comes from the dedicated encoder
# channel, not from the per-video piggyback one. On T31 with OpenIMP a PT_JPEG
# channel registered into a video encoder group never emits a frame, so the
# piggyback default made /snapshot.jpg answer 503 "no frame" and its watchdog
# kept cycling the framesource; a dedicated channel at imp_chn 2 encodes
# normally. Disabled piggybacks so only one JPEG path exists.
video0.jpeg = 0
video1.jpeg = 0
jpeg.enabled = 1
jpeg.imp_chn = 2
jpeg.width = 640
jpeg.height = 360
jpeg.fps = 5
